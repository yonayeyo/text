<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SLIP">

<title>SLIP 청년 금융 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

<style>
/*
  LAYOUT GUIDE — 393 × 852 (iPhone 15/16)
  · 4 columns · margin 20 · gutter 12 · content width 353
  · spacing scale (4pt): 4 / 8 / 12 / 16 / 24 / 32 / 40
      – inside a group 8 · between cards 12 · card padding 24 · between sections 40
  · type scale (hierarchy by size, single weight 500):
      Pretendard 18 / 16 / 14 / 12 / 10 · numerals (Nexa → Outfit) 56 / 32 / 24 · display (Altersick → Bodoni Moda) 17 / 34
      line-height 1.45 for Korean text, 1 for numerals
  · radius: card 32 (corner smoothing) · sheet 32 · button & chip 999 · icon button = circle
  · icons: 24 box, 1.5px line
*/
:root{
  --ink:#181818; --g6:#606060; --g3:#DEDEDE; --paper:#FCFCFC; --bg:#FAFAFA;
  --g8:#2B2B2B; --g4:#9C9C9C; --g2:#EFEFEF;
  --sky:#C8E1FF; --rose:#FF769C;
  --aura:linear-gradient(120deg,#FFD6E2 0%,#E7DDF7 45%,#C8E1FF 100%);
  --f-kr:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --f-num:"Nexa","Outfit","Pretendard Variable",system-ui,sans-serif;
  --f-disp:"Altersick","Bodoni Moda",Didot,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --m:20px; --gut:12px; --r:32px;
  --fg:var(--ink); --inv:var(--paper); --mute:var(--g6); --line:var(--g3); --surface:var(--paper);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E7E7E5}
body{font-family:var(--f-kr);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input{font:inherit;color:inherit}
svg{display:block}
.num,.n56,.n32,.n24,.n20{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{min-height:100vh;display:flex;gap:48px;justify-content:center;align-items:flex-start;padding:40px 16px 64px}
.panel{width:280px;position:sticky;top:40px;display:grid;gap:24px;font-size:13px;color:var(--ink)}
.panel h1{font-family:var(--f-disp);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.01em}
.panel .lead{color:var(--g6);font-size:13px;line-height:1.55}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--g6);margin-bottom:8px;font-weight:500}
.panel .pl{display:flex;flex-wrap:wrap;gap:6px}
.panel .pl button{height:32px;padding:0 12px;border-radius:999px;background:var(--paper);border:1px solid var(--g3);font-size:12px}
.panel .pl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel .spec{font-family:var(--f-mono);font-size:11px;color:var(--g6);line-height:1.7}

.device{width:413px;height:872px;padding:10px;border-radius:64px;background:#0E0E0E;box-shadow:0 0 0 2px #3a3a3a inset,0 30px 60px -20px rgba(0,0,0,.35);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:var(--bg);isolation:isolate}
@media (max-width:760px){
  .stage{flex-direction:column;align-items:center;padding:0 0 48px;gap:32px}
  .device{width:100%;max-width:413px;height:852px;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .panel{position:static;width:auto;max-width:393px;padding:0 16px}
}
.log{font-family:var(--f-mono);font-size:11px;line-height:1.6;max-height:280px;overflow:auto;padding:12px 16px;border-radius:20px;background:var(--g2);-webkit-user-select:text;user-select:text;white-space:pre-wrap}

/* ---------- screen chrome ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;background:linear-gradient(var(--page) 78%,transparent);padding:16px 30px 0 40px;display:flex;justify-content:space-between;font-size:16px;z-index:30;pointer-events:none;color:var(--fg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:999px;background:#000;z-index:31}
.screen{--page:var(--bg)}.screen.dark{--page:var(--ink);background:var(--ink)}
.view{position:absolute;inset:0;z-index:1;overflow-y:auto;scrollbar-width:none;padding:59px var(--m) 160px;color:var(--fg);background:transparent}
.view::-webkit-scrollbar{display:none}
.screen.dark{--fg:var(--paper);--inv:var(--ink);--mute:var(--g4);--line:#3A3A3A;--surface:#222}
.halftone{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--ink) 1.1px,transparent 1.5px);background-size:5px 5px;
  -webkit-mask-image:linear-gradient(transparent,rgba(0,0,0,.55) 70%,#000);mask-image:linear-gradient(transparent,rgba(0,0,0,.55) 70%,#000);opacity:.55}
.screen.dark .halftone{background-image:radial-gradient(circle,#FCFCFC 1px,transparent 1.4px);opacity:.25}
.screen.nonav .halftone,.screen.home .halftone{display:none}
.screen.home{--page:#FAFAFA}

.keeps{display:grid;gap:4px}
.keeps .kr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;min-height:40px}
.pick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--g4);flex:none}
.cut{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:16px 20px;border-radius:24px;box-shadow:inset 0 0 0 1px #3a3a3a;background:var(--ink);text-align:left}
.cut.on{background:var(--paper);color:var(--ink);box-shadow:none;--mute:var(--g6)}
.cut.on .pick{background:var(--ink);color:var(--paper);box-shadow:none}
.stepn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-num);font-size:12px;box-shadow:inset 0 0 0 1px currentColor;margin-right:8px;vertical-align:1px}

/* ---------- type ---------- */
.t18{font-size:18px}.t16{font-size:16px}.t14{font-size:14px}.t12{font-size:12px}.t10{font-size:10px}
.mute{color:var(--mute)}
.n56{font-family:var(--f-num);font-weight:300;font-size:56px;line-height:1;letter-spacing:-.02em}
.n32{font-family:var(--f-num);font-weight:300;font-size:32px;line-height:1;letter-spacing:-.01em}
.n24{font-family:var(--f-num);font-weight:400;font-size:24px;line-height:1}
.n20{font-family:var(--f-num);font-weight:400;font-size:20px;line-height:1}
.disp{font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em}
.eng{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.cur{font-family:var(--f-num);font-weight:400;margin-left:.25em}

/* ---------- layout helpers ---------- */
.row{display:flex;align-items:center}.between{justify-content:space-between}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.stack{display:grid;gap:12px}.stack8{display:grid;gap:8px}.stack4{display:grid;gap:4px}
.sec{margin-top:40px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px}
.sec-h .t18{line-height:1.3}
.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}

/* ---------- cards ---------- */
.card{border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
@supports (corner-shape:superellipse(1.6)){.card,.sheet{corner-shape:superellipse(1.6);border-radius:42px}}
.c-paper{background:var(--paper);box-shadow:0 0 0 1px rgba(24,24,24,.05)}
.c-ink{background:var(--ink);color:var(--paper);--fg:var(--paper);--inv:var(--ink);--mute:var(--g4);--line:#3A3A3A}
.c-light{background:var(--paper);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.screen.dark .c-ink{background:var(--paper);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.screen.dark .c-paper{background:#232323;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.c-sky{background:radial-gradient(90% 120% at 80% 100%,#B9D7FF 0%,#D9E9FF 45%,#F2F7FF 100%);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:rgba(24,24,24,.14);box-shadow:inset 0 0 24px rgba(255,255,255,.9)}
.c-aura{background:radial-gradient(70% 80% at 0% 0%,rgba(255,118,156,.42),transparent 70%),radial-gradient(90% 100% at 100% 100%,#BCD8FF,transparent 75%),#F1EEF7;color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:rgba(24,24,24,.14);box-shadow:inset 0 0 24px rgba(255,255,255,.85)}
.c-glass{background:rgba(252,252,252,.62);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.8);color:var(--ink);--mute:var(--g6);--line:var(--g3)}
.c-dash{border:1.5px dashed var(--g3);background:var(--paper)}
.screen.dark .c-dash{border-color:#444;background:var(--ink)}

/* ---------- controls ---------- */
.btn{height:48px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;white-space:nowrap}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.btn.sm{height:36px;padding:0 16px;font-size:14px}
.btn.full{width:100%}
.screen.dark .btn:not(.light):not(.ghost){background:var(--paper);color:var(--ink)}
.c-ink .btn:not(.ghost){background:var(--paper);color:var(--ink)}
.screen.dark .c-ink .btn:not(.ghost){background:var(--ink);color:var(--paper)}
.ib{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative}
.ib.glass{background:rgba(252,252,252,.7);border:1px solid rgba(24,24,24,.06);backdrop-filter:blur(12px)}
.ib.ink{background:var(--ink);color:var(--paper)}
.ib.paper{background:var(--paper);color:var(--ink)}
.ib .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--paper)}
.chip{height:32px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--fg);color:var(--inv);box-shadow:none}
.tag{height:22px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:10px;white-space:nowrap}
.tag.ink{background:var(--fg);color:var(--inv)}
.tag.line{box-shadow:inset 0 0 0 1px var(--line)}
.tag.dash{border:1px dashed var(--g4)}
.tag.glow{background:var(--aura);color:var(--ink)}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(24,24,24,.06);gap:4px}
.screen.dark .seg{background:rgba(252,252,252,.1)}
.seg button{flex:1;height:36px;border-radius:999px;font-size:14px;color:var(--mute);padding:0 16px}
.seg button.on{background:var(--fg);color:var(--inv)}
.hair{height:1px;background:var(--line);border:0}
.term{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 1px var(--mute);color:var(--mute);vertical-align:2px;margin-left:4px;font-family:var(--f-num)}
.term-def{display:none;margin-top:8px;padding:12px 16px;border-radius:20px;background:rgba(24,24,24,.05);font-size:12px;line-height:1.55;color:var(--mute)}
.term-def.open{display:block}
.c-ink .term-def{background:rgba(252,252,252,.08)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--g3);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .2s}
.switch.on{background:var(--ink)}.switch.on::after{transform:translateX(18px)}
.screen.dark .c-paper .switch{background:#444}.screen.dark .c-paper .switch.on{background:var(--paper)}.screen.dark .c-paper .switch.on::after{background:var(--ink)}

/* ---------- nav & AI dock ---------- */
.tabbar{position:absolute;left:var(--m);right:var(--m);bottom:24px;height:64px;padding:8px;border-radius:999px;z-index:20;display:flex;justify-content:space-between;align-items:center;
  background:rgba(24,24,24,.78);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.18)}
.tab{height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--paper);font-size:14px;padding:0 10px;transition:background .25s}
.tab span{display:none}
.tab.on{background:var(--paper);color:var(--ink);padding:0 18px}
.tab.on span{display:inline}
.screen.nonav .tabbar,.screen.nonav .ai-dock{display:none}
.ai-dock{position:absolute;left:var(--m);right:var(--m);bottom:100px;height:56px;padding:8px;border-radius:999px;z-index:19;display:flex;align-items:center;gap:8px;
  background:rgba(252,252,252,.72);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(24,24,24,.08)}
.ai-dock input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;outline:0;color:var(--ink)}
.ai-dock input::placeholder{color:var(--g6)}
.ai-dock .ib{background:rgba(24,24,24,.06);color:var(--ink)}
.ai-dock .ib.ink{background:var(--ink);color:var(--paper)}
.ai-dock[hidden]{display:none}

/* ---------- sheet & toast ---------- */
.layer{position:absolute;inset:0;z-index:40;background:rgba(24,24,24,.36);backdrop-filter:blur(6px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.layer.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;background:var(--bg);color:var(--ink);border-radius:32px 32px 0 0;padding:16px var(--m) 40px;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.layer.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g3);margin:0 auto 16px}
.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);width:124px;height:40px;border-radius:24px;background:#000;color:var(--paper);z-index:45;opacity:0;overflow:hidden;transition:all .45s cubic-bezier(.2,.9,.2,1);padding:0}
.toast.open{opacity:1;width:369px;height:auto;transform:translateX(-50%);padding:16px 20px;border-radius:32px}
.toast-in{opacity:0;transition:opacity .2s .2s}.toast.open .toast-in{opacity:1}

/* ---------- home ---------- */
.urgent{width:100%;height:48px;margin-top:16px;border-radius:999px;padding:0 6px 0 20px;display:flex;align-items:center;gap:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--g3)}
.urgent .u-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:none}
.urgent .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.hero{text-align:center;margin-top:32px}
.hero-n{display:flex;justify-content:center;align-items:baseline;gap:8px;margin:12px 0 8px}
.meter{margin-top:24px;position:relative}
.meter .bars{display:flex;justify-content:space-between;height:44px}
.meter .bars i{width:2px;background:var(--ink);border-radius:1px}
.meter .bars i.off{background:var(--g3)}
.meter .bars i.now{width:3px;background:var(--sky);box-shadow:0 0 8px 2px rgba(200,225,255,.9)}
.meter .lbl{display:flex;justify-content:space-between;margin-top:8px}
.meter .mk{position:absolute;top:-20px;transform:translateX(-50%);white-space:nowrap}
.next-card{display:grid;gap:16px}
.pillcols{display:flex;justify-content:space-between;align-items:flex-end;height:150px;padding-top:8px}
.pillcols .col{display:grid;justify-items:center;gap:8px;width:44px}
.pillcols .pill{width:32px;border-radius:999px}
.glowbar{height:12px;border-radius:999px;background:rgba(24,24,24,.08);position:relative}
.glowbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#C8E1FF,#FF769C)}
.glowbar i::after{content:"";position:absolute;inset:-6px;border-radius:999px;background:inherit;filter:blur(10px);opacity:.75;z-index:-1}

/* ---------- receipt ---------- */
.printer{margin-top:24px}
.slot{height:34px;border-radius:999px;position:relative;z-index:3;background:linear-gradient(#FBFBFB,#D2D2D2 40%,#A9A9A9 85%,#8E8E8E);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 4px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.2)}
.slot::after{content:"";position:absolute;left:18px;right:18px;bottom:9px;height:5px;border-radius:3px;background:#1a1a1a;box-shadow:inset 0 2px 2px #000}
.slot .led{position:absolute;right:26px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--sky);opacity:.5}
.printer.printing .led{animation:blink .25s steps(2) infinite;opacity:1}
@keyframes blink{50%{opacity:.2}}
.feed{margin:-16px 14px 0;overflow:hidden;padding-bottom:12px;position:relative;z-index:2}
.feed::before{content:"";position:absolute;left:0;right:0;top:0;height:28px;background:linear-gradient(rgba(0,0,0,.28),transparent);z-index:2;pointer-events:none}
.paper{background:linear-gradient(90deg,#F1F1F1,#FCFCFC 6%,#FCFCFC 94%,#F1F1F1);color:var(--ink);font-family:var(--f-mono);font-size:12px;line-height:1.6;padding:36px 20px 24px;position:relative;--mute:#7A7A7A;--line:#CFCFCF}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:conic-gradient(from -45deg at bottom,#FCFCFC 90deg,transparent 0) 50%/12px 100%}
.printer.printing .paper{animation:feed 2.4s steps(32,end) both}
@keyframes feed{from{transform:translateY(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.printer.printing .paper{animation:none}.toast,.layer,.sheet{transition:none}}
.p-c{text-align:center}
.p-title{font-family:var(--f-disp);font-weight:600;font-size:36px;line-height:1;letter-spacing:-.015em}
.p-rule{border:0;border-top:1px dashed #9a9a9a;margin:14px 0}
.p-rule.d{border-top:3px double var(--ink)}
.p-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.p-row .k{color:var(--mute)}
.p-sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;font-weight:500}
.p-grid{display:grid;grid-template-columns:1fr 34px 76px;gap:0 8px;align-items:baseline}
.p-grid .r{text-align:right}
.p-grid .h{font-size:10px;color:var(--mute);letter-spacing:.1em;padding-bottom:4px;border-bottom:1px solid var(--ink)}
.p-grid .d{grid-column:1/-1;font-size:10px;color:var(--mute);margin:-2px 0 6px}
.p-total{display:flex;justify-content:space-between;align-items:flex-end}
.p-total .n32{font-size:34px}
.p-box{border:1px solid var(--ink);border-radius:999px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.p-box.dash{border-style:dashed}
.p-btn{width:100%;margin-top:8px;height:36px;border-radius:999px;border:1px dashed var(--ink);font-family:var(--f-mono);font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px}
.p-btn.on{background:var(--ink);color:var(--paper);border-style:solid}
.barcode{display:flex;justify-content:center;height:40px;margin:16px 0 6px}
.barcode i{background:var(--ink);display:block}
.blk{letter-spacing:-1px}

/* ---------- onboarding ---------- */
.aura-blob{position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none}
/* onboarding: self check */
.ob-col{min-height:776px;display:flex;flex-direction:column}
.ob-foot{margin-top:auto;padding-top:32px;display:grid;gap:8px}
.steps{display:flex;gap:6px}.steps i{width:28px;height:4px;border-radius:2px;background:#3a3a3a}.steps i.on{background:var(--paper)}
.ob-title{font-size:28px;line-height:1.3;font-weight:500}
.sc-card{background:#232323;border-radius:32px;padding:24px 20px 20px}
.badge-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--aura);color:var(--ink);font-family:var(--f-num);font-size:16px}
.slider{position:relative;height:40px;border-radius:999px;background:#2E2E2E;display:grid;grid-template-columns:repeat(10,1fr)}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--aura);pointer-events:none}
.slider button{position:relative;z-index:1;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;color:var(--g4);border-radius:999px}
.slider button.in{color:var(--ink)}
.slider button.on{background:var(--paper);color:var(--ink);font-size:20px;margin:-4px -6px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.cta{width:100%;height:64px;border-radius:999px;background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:12px;padding:0 8px 0 28px}
.cta .ib{background:var(--ink);color:var(--paper);width:48px;height:48px}
/* onboarding: question */
.qprog{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qprog .ar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.qprog i{height:5px;border-radius:3px;background:var(--g3)}
.qprog i.done{background:var(--ink)}
.qprog i.cur{background:var(--aura);box-shadow:0 0 0 1.5px var(--ink)}
.qprog .nm{font-size:10px;color:var(--g4);margin-top:8px;white-space:nowrap}
.qprog .nm.on{color:var(--ink)}
.counter{height:32px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;font-family:var(--f-num);font-size:13px}
.opt{width:100%;min-height:64px;border-radius:32px;padding:12px 20px 12px 12px;display:flex;align-items:center;gap:14px;font-size:14px;line-height:1.45;background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px rgba(24,24,24,.04)}
.opt .lt{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--g2);font-family:var(--f-num);font-size:13px}
.opt.on{background:var(--aura);box-shadow:none}
.opt.on .lt{background:var(--ink);color:var(--paper)}
.opt.unk{background:transparent;box-shadow:none;border:1.5px dashed var(--g4)}
.opt.unk .lt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--g4);border:0}
.opt.unk.on{background:var(--aura);border-color:transparent}
/* onboarding: result */
.quad{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:320px}
.quad .tl-{border-radius:28px;background:#232323;padding:16px 18px;display:flex;flex-direction:column;font-size:12px;color:var(--g4)}
.quad .tl-.on{background:var(--aura);color:var(--ink)}
.quad .tl-.r{text-align:right}.quad .tl-.b{justify-content:flex-end}
.quad .pt{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.quad .lbl{position:absolute;font-size:10px;white-space:nowrap;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--paper);transform:translateY(-50%)}
.res-sheet{margin:32px calc(var(--m) * -1) 0;padding:24px var(--m) 48px;background:var(--bg);color:var(--ink);border-radius:32px 32px 0 0;--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.gaptrack{position:relative;height:8px;border-radius:999px;background:var(--g2);margin:14px 9px 4px}
.gaptrack .bar{position:absolute;top:2px;height:4px;background:var(--ink);border-radius:2px}
.gaptrack .me,.gaptrack .dx{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%)}
.gaptrack .me{border:1.5px dashed var(--ink);background:var(--paper)}
.gaptrack .dx{background:var(--aura);box-shadow:inset 0 0 0 1.5px var(--ink)}
.bf{display:grid;grid-template-columns:22px 1fr 76px 1fr 22px;gap:8px;align-items:center;min-height:36px}
.bf .l{display:flex;justify-content:flex-end}.bf .bar{height:22px;border-radius:999px}
.bf.dim{opacity:.45}
.opt.unk.on{border-color:var(--paper)}

/* ---------- misc viz ---------- */
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.dots i.o{background:transparent;box-shadow:inset 0 0 0 1px var(--g4)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp{display:grid;justify-items:center;gap:8px;text-align:center}
.stamp .st{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.stamp.done .st{background:var(--ink);color:var(--paper)}
.stamp.todo .st{border:1.5px dashed var(--g4);color:var(--g6)}
.setrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;justify-items:center}
.cal .wd{font-size:10px;color:var(--mute);padding-bottom:4px}
.cal .d{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.cal .d.zero{background:var(--fg);color:var(--inv)}
.cal .d.ok{background:var(--sky);color:var(--ink)}
.cal .d.over{background:var(--rose);color:var(--ink)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal .d.future{color:var(--mute)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%}
.badge{display:grid;justify-items:center;gap:6px;text-align:center}
.badge .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.badge .b.got{background:var(--aura)}
.badge .b.lock{border:1.5px dashed var(--g3);color:var(--g4)}
.matrix{display:grid;grid-template-columns:1fr repeat(4,36px);gap:10px 4px;align-items:center}
.matrix .c{display:grid;place-items:center}
.matrix .c i{width:12px;height:12px;border-radius:50%}
.m-yes{background:var(--ink)}.m-chk{box-shadow:inset 0 0 0 1.5px var(--ink)}.m-na{width:10px!important;height:1.5px!important;border-radius:0!important;background:var(--g4)}
.tl{position:relative;display:grid;gap:20px;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--g3)}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tl .it.hot::before{background:var(--rose);box-shadow:none}
.grid-ov{position:absolute;inset:0;z-index:60;pointer-events:none;display:none;grid-template-columns:repeat(4,1fr);gap:var(--gut);padding:0 var(--m)}
.grid-ov.on{display:grid}
.grid-ov i{background:rgba(255,118,156,.12);border-left:1px solid rgba(255,118,156,.5);border-right:1px solid rgba(255,118,156,.5)}
.ai-a{border-radius:24px;padding:16px 20px;font-size:14px;line-height:1.6}
.ai-q{justify-self:end;max-width:80%;background:var(--ink);color:var(--paper);border-radius:24px;padding:12px 18px;font-size:14px}
/* 휴대폰에서 열면 기기 프레임·패널 없이 전체 화면 앱으로 동작 (사용성 테스트용) */
@media (max-width:520px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
  body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
  .stage{display:block;min-height:0;padding:0}
  .panel{display:none}
  .device{position:fixed;inset:0;width:100%;max-width:none;height:100%;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .island,.statusbar>*{display:none!important}
  .statusbar{height:env(safe-area-inset-top,0px);padding:0;background:var(--page)}
  .view{padding-top:calc(env(safe-area-inset-top,0px) + 4px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .tabbar{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .ai-dock{bottom:calc(env(safe-area-inset-bottom,0px) + 88px)}
  .ai-dock input{font-size:16px}
  .toast{top:calc(env(safe-area-inset-top,0px) + 8px)}
  .toast.open{width:calc(100% - 24px)}
  .sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
  .ob-col{min-height:calc(100dvh - env(safe-area-inset-top,0px) - 40px)}
  .res-sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px)}
  button:active,.opt:active,.cut:active{transform:scale(.97);transition:transform .08s}
}
</style>
</head>

function scores() {
  const ans = S.answers.map((a, i) => a == null ? Q[i].s : a);
  const filled = S.answers.filter(a => a == null).length;
  let kc = 0, kn = 0; const pv = [];
  const area = AREAS.map(() => ({ known:0, p:[], k:0 }));
  Q.forEach((q, i) => {
    const a = ans[i], A = area[q.a];
    if (a !== 3) A.known++;
    if (q.t === 'k') { kn++; if (a !== 3 && q.v[a] === 1) { kc++; A.k++; } }
    else { const sc = a === 3 ? 0 : { 3:10, 2:5, 1:1 }[q.v[a]]; pv.push(sc); A.p.push(sc); }
  });
  const k = kc / kn * 10, p = pv.reduce((s, x) => s + x, 0) / pv.length;
  const areas = AREAS.map((ar, i) => ({ ...ar, interest:area[i].known / 4 * 10, practice:area[i].p.reduce((s, x) => s + x, 0) / 2 }));
  const persona = k >= 5 ? (p >= 5 ? 'self' : 'cog') : (p >= 5 ? 'habit' : 'low');
  const rec = areas.filter(a => a.now).sort((a, b) => (b.interest - b.practice * .3) - (a.interest - a.practice * .3))[0];
  return { k, p, areas, persona, rec, filled };
}

  const L = [
    ['pay','life',1450000], ['pay','save',650000], ['pay','emer',100000],

function stairs(saved) {
  const W_ = 305, base = 176, sw = (W_ - 12) / 4;
  let cur = STAGES.findIndex(s => saved < s.a); if (cur < 0) cur = 3;
  return `<svg viewBox="0 0 305 200" width="100%" role="img" aria-label="중간 목표 4단계 중 ${cur + 1}단계 진행 중">
    <defs><linearGradient id="st" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C8E1FF"/><stop offset="1" stop-color="#FF769C"/></linearGradient></defs>
    ${STAGES.map((s, i) => { const h = 30 + i * 32, x = i * (sw + 4), y = base - h; const prev = i ? STAGES[i - 1].a : 0;
      const p = Math.max(0, Math.min(1, (saved - prev) / (s.a - prev)));
      const done = i < cur, now = i === cur;
      return `<rect x="${x}" y="${y}" width="${sw}" height="${h}" rx="16" fill="${done ? '#181818' : 'none'}" stroke="${done ? 'none' : '#9C9C9C'}" ${done ? '' : 'stroke-dasharray="3 3"'}/>
        ${now ? `<clipPath id="sc${i}"><rect x="${x}" y="${y}" width="${sw}" height="${h}" rx="16"/></clipPath><rect x="${x}" y="${y + h * (1 - p)}" width="${sw}" height="${h * p}" fill="url(#st)" clip-path="url(#sc${i})"/>` : ''}
        <text x="${x + 10}" y="${y - 22}" font-size="10" fill="${now ? '#181818' : '#606060'}">${i + 1}단계${now ? ' · 지금' : ''}</text>
        <text x="${x + 10}" y="${y - 8}" font-size="12" font-family="Outfit" fill="#181818">${man(s.a)}</text>
        <text x="${x + sw / 2}" y="${base + 18}" font-size="10" text-anchor="middle" fill="#606060">${s.n}</text>
        ${done ? `<path d="M${x + sw / 2 - 6} ${base - 14} l4 4 8-8" stroke="#FCFCFC" stroke-width="1.5" fill="none"/>` : ''}`; }).join('')}
  </svg>`;
}
function planActual() {
  const L = GOAL_LINE, n = L.months.length, X = i => 40 + i / (n - 1) * 258, Y = v => 150 - v / 5000000 * 130;
  const act = L.actual.map((v, i) => [X(i), Y(v)]);
  const smooth = pts => pts.reduce((d, p, i, a) => { if (!i) return `M${p[0]} ${p[1]}`; const p0 = a[i - 2] || a[i - 1], p1 = a[i - 1], p2 = p, p3 = a[i + 1] || p;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    return d + ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }, '');
  const last = act[act.length - 1], gi = L.actual.length - 1;
  const proj = [last]; let v = S.goalSaved; for (let i = gi + 1; i < n; i++) { v = Math.min(5000000, v + 350000); proj.push([X(i), Y(v)]); }
  const planNow = 5000000 * gi / (n - 1), gap = S.goalSaved - planNow;
  return { gap, svg:`<svg viewBox="0 0 305 176" width="100%" role="img" aria-label="계획 대비 실제 누적 저축. 현재 계획보다 ${won(Math.abs(gap))}원 ${gap < 0 ? '부족' : '앞섬'}">
    <defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8E1FF" stop-opacity=".9"/><stop offset="1" stop-color="#C8E1FF" stop-opacity="0"/></linearGradient></defs>
    ${[0,2500000,5000000].map(v => `<line x1="40" x2="298" y1="${Y(v)}" y2="${Y(v)}" stroke="#181818" stroke-opacity=".12" stroke-width=".75"/><text x="34" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="#606060" font-family="Outfit">${v ? man(v) : 0}</text>`).join('')}
    <path d="${smooth(act)} L${last[0]} 150 L40 150Z" fill="url(#pa)"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n - 1)}" y2="${Y(5000000)}" stroke="#181818" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${smooth(proj)}" fill="none" stroke="#FF769C" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <path d="${smooth(act)}" fill="none" stroke="#181818" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#181818"/><circle cx="${last[0]}" cy="${last[1]}" r="10" fill="none" stroke="#181818" stroke-opacity=".25"/>
    <line x1="${last[0]}" x2="${last[0]}" y1="${Y(planNow)}" y2="${last[1]}" stroke="#181818" stroke-width="1"/>
    ${[0, gi, n - 1].map(i => `<text x="${X(i)}" y="168" font-size="9" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" fill="#606060" font-family="Outfit">${L.months[i]}</text>`).join('')}
  </svg>` };
}

  return `<header class="top"><div><div class="t18">목표</div><div class="t12 mute">목표 3개 · 챌린지 1개 참여 중</div></div><button class="ib ink" data-act="sheet" data-sheet="goalAdd" aria-label="목표 추가">${ic('plus', 20)}</button></header>

  <div class="card c-aura mt16">

    <div class="card c-paper">${pa.svg}

      <button class="btn full mt16 ${S.cert ? 'ghost' : ''}" data-act="cert">${S.cert ? ic('check', 18) + ' 오늘 인증 완료 · +20 P' : '오늘 무지출 인증하기'}</button>

let lastKey = '';
function render(keepScroll = true) {
  const key = S.mode === 'onboard' ? 'ob' + S.ob : 'tab' + S.tab;
  const st = keepScroll && key === lastKey ? view.scrollTop : 0;
  const dark = S.mode === 'onboard' ? S.ob !== 2 : S.tab === 'spend';
  screen.classList.toggle('dark', dark);

  toast(`<div class="row between"><span class="t12" style="color:var(--g4)">${label}</span><span class="n20">+${won(amt)} ₩</span></div><div class="t14 mt8">독립 자금 ${pct(b / 5000000)} → ${pct(S.goalSaved / 5000000)}</div><div class="glowbar mt12" style="height:6px;background:#333"><i style="width:${S.goalSaved / 50000}%"></i></div>`, 4200);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-term]');
  if (tb) { const host = tb.closest('.card') || tb.parentElement; const def = host.querySelector('.term-def'); def && def.classList.toggle('open'); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'layer') closeSheet(); return; }
  log('탭 ' + el.dataset.act + (el.dataset.v ? ':' + el.dataset.v : el.dataset.sheet ? ':' + el.dataset.sheet : el.dataset.tab ? ':' + el.dataset.tab : '') + (S.mode === 'onboard' && el.dataset.act === 'ans' ? ` (Q${S.q + 1})` : ''));
  const a = el.dataset.act, v = el.dataset.v;
  switch (a) {
    case 'ob': S.mode = 'onboard'; S.ob = +v; closeSheet(); render(false); break;
    case 'toApp': S.mode = 'app'; S.tab = 'home'; render(false); break;
    case 'self': S.self[el.dataset.k] = +v; render(); break;
    case 'ans': S.answers[S.q] = +v; render(); break;
    case 'qNext': if (S.answers[S.q] == null) return; if (S.q < 19) { S.q++; render(false); } else { S.ob = 3; render(false); } break;
    case 'qPrev': if (S.q > 0) { S.q--; render(false); } else { S.ob = 1; render(false); } break;
    case 'togglePrev': S.showPrev = !S.showPrev; render(); break;
    case 'resLink': S.persona = scores().persona; S.mode = 'app'; S.tab = 'home'; render(false); simpleToast('계좌 6개 · 카드 3개를 연동했어요'); break;
    case 'resSetup': S.persona = scores().persona; S.mode = 'app'; S.tab = 'plan'; render(false); break;
    case 'rediag': closeSheet(); S.mode = 'onboard'; S.ob = 1; S.q = 0; render(false); break;
    case 'tab': closeSheet(); S.mode = 'app'; S.tab = el.dataset.tab; render(false); break;
    case 'sheet': openSheet(el.dataset.sheet); break;
    case 'closeSheet': closeSheet(); break;
    case 'toast': closeSheet(); simpleToast(el.dataset.msg); break;
    case 'mic': simpleToast('음성 입력은 데모에서 지원하지 않아요'); break;
    case 'settleDo': S.settled = true; S.spent -= 48000; closeSheet(); render(); simpleToast(`정산 처리 · 오늘 쓸 수 있는 돈 ${W(D().daily)}`); break;
    case 'alloc': S.alloc = v; render(); refreshSheet(); break;
    case 'allocDo': { const r = { bal:.5, save:.7, free:.3 }[S.alloc]; S.allocDone = true; S.incomeIn = false; S.emergency += 320000 * ({ bal:.3, save:.2, free:.2 }[S.alloc]); closeSheet(); goalBump(320000 * r, '알바비 배분 완료'); break; }
    case 'sv': S.spendView = v; render(false); break;
    case 'period': S.period = v; S.topSel = null; render(); break;
    case 'print': reprint(v); break;
    case 'keep': S.keeps.has(v) ? S.keeps.delete(v) : S.keeps.add(v); render(); break;
    case 'sugg': S.applied.has(v) ? S.applied.delete(v) : S.applied.add(v); render(); break;
    case 'repApply': S.applied.has(v) ? S.applied.delete(v) : S.applied.add(v); render(); break;
    case 'fixedOk': S.fixedSet = true; S.switches.fixed = true; render(); simpleToast('고정 지출 4건 등록 · 필수 설정 완료'); break;
    case 'sw': S.switches[v] = S.switches[v] === false; render(); break;
    case 'ratioOk': S.ratioOk = true; S.ratioEdit = false; render(); break;
    case 'ratioEdit': S.ratioEdit = !S.ratioEdit; render(); break;
    case 'step': S.cat[el.dataset.c] = Math.max(0, S.cat[el.dataset.c] + +el.dataset.d); render(); break;
    case 'wAmt': S.wAmt = +v; refreshSheet(); break;
    case 'wDo': { const amt = S.wAmt; S.goalSaved -= amt; closeSheet(); render(); simpleToast(`${W(amt)}을 생활비 통장으로 옮겼어요`); break; }
    case 'goalSel': S.goalSel = v; render(); break;
    case 'gType': S.gNew.type = v; refreshSheet(); break;
    case 'gAmt': S.gNew.amt = +v; refreshSheet(); break;
    case 'gMon': S.gNew.months = +v; refreshSheet(); break;
    case 'gCreate': { const g = S.gNew; const id = 'g' + Date.now(); const t = new Date(2026, 9 + g.months, 1);
      S.goals.push({ id, n:g.type, target:g.amt, saved:0, due:`${t.getFullYear()}.${String(t.getMonth() + 1).padStart(2, '0')}` }); S.goalSel = id; closeSheet(); render(); simpleToast(`${g.type} 목표를 만들었어요`); break; }
    case 'cert': S.cert = !S.cert; render(); break;
    case 'like': S.liked.has(+v) ? S.liked.delete(+v) : S.liked.add(+v); render(); break;
    case 'benMove': S.benefitMoved = true; S.emergency += 12300; render(); simpleToast('12,300 ₩을 비상금으로 옮겼어요'); break;
    case 'ptMove': S.pointsMoved = true; goalBump(32440, '포인트 현금 전환'); break;
    case 'topSel': S.topSel = v; render(); break;
    case 'cutApply': { const ch = SUGG.filter(s => !S.keeps.has(s.c) && S.applied.has(s.id) && CUT_CAT[s.id]).map(s => { const c = CUT_CAT[s.id], a = S.cat[c], b = Math.max(0, Math.round((a - s.save) / 1000) * 1000); S.cat[c] = b; return [c, a, b]; });
      if (SUGG.some(s => s.id === 's4' && S.applied.has('s4') && !S.keeps.has('구독'))) ch.push(['구독', 45000, 31500]);
      S.cutApplied = ch; render(); simpleToast('11월 예산에 반영했어요'); break; }
    case 'cutUndo': S.cutApplied.forEach(([c, a]) => { if (S.cat[c] != null) S.cat[c] = a; }); S.cutApplied = null; render(); break;
    case 'persona': S.persona = v; S.mode = 'app'; S.tab = 'home'; closeSheet(); render(false); break;
    case 'mod':
      closeSheet(); S.mode = 'app';
      if (v === 'pay') { S.tab = 'home'; render(false); payment(); }
      if (v === 'income') { S.tab = 'home'; S.incomeIn = true; S.allocDone = false; render(false); openSheet('alloc'); }
      if (v === 'settle') { if (S.settled) { S.settled = false; S.spent += 48000; } S.tab = 'home'; render(false); }
      if (v === 'reset') { log('--- 처음부터 다시 ---'); location.reload(); }
      break;
    case 'logCopy': { const txt = logText(); const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('logBox')); const g = getSelection(); g.removeAllRanges(); g.addRange(r); simpleToast('기록을 선택했어요. 길게 눌러 복사하세요'); };
      try { navigator.clipboard.writeText(txt).then(() => simpleToast('탭 기록을 복사했어요'), sel); } catch (err) { sel(); } break; }
    case 'logClear': LOG = []; try { localStorage.removeItem(LOG_KEY); } catch (err) {} refreshSheet(); break;
    case 'flow': S.flowSel = S.flowSel === v ? null : v; render(); break;
    case 'interest': S.interest.has(v) ? S.interest.delete(v) : S.interest.add(v); render(); break;
    case 'aiAsk': ask(v); break;
  }
});
function ask(q) { if (!q.trim()) return; const r = aiAnswer(q); S.chat.push({ q }, r); if (S.chat.length > 6) S.chat = S.chat.slice(-6); openSheet('ai'); const sh = document.getElementById('sheet'); sh.scrollTop = sh.scrollHeight; }
document.getElementById('aiDock').addEventListener('submit', e => { e.preventDefault(); const i = document.getElementById('aiInput'); ask(i.value || '오늘 얼마 더 써도 돼?'); i.value = ''; });
document.querySelector('#aiDock [data-act="mic"]').innerHTML = ic('mic', 20);
document.querySelector('#aiDock [type="submit"]').innerHTML = ic('send', 20);

/* ---------- side panel ---------- */
function renderPanel() {
  const cur = S.mode === 'onboard' ? 'ob' + S.ob : S.tab === 'spend' ? 'spend-' + S.spendView : S.tab;
  const sc = [ ['ob0','진단 시작'], ['ob1','자기평가'], ['ob2','진단 문항'], ['ob3','진단 결과'], ['home','홈'], ['spend-analysis','분석 및 조정'], ['spend-report','리포트'], ['plan','플랜'], ['goal','목표'], ['benefit','혜택'] ];
  document.getElementById('navScreens').innerHTML = sc.map(([k, n]) => `<button type="button" class="${cur === k ? 'on' : ''}" data-go="${k}">${n}</button>`).join('');
  document.getElementById('navPersona').innerHTML = Object.entries(PERSONA).map(([k, p]) => `<button type="button" class="${S.persona === k ? 'on' : ''}" data-persona="${k}">${p.name}</button>`).join('');
  document.getElementById('navScen').innerHTML = [ ['pay','결제 발생 → 실시간 피드백'], ['income','알바비 입금 → 배분'], ['settle','더치페이 정산'], ['withdraw','저축 인출 확인'], ['ai','AI 조언 묻기'] ].map(([k, n]) => `<button type="button" data-scen="${k}">${n}</button>`).join('');
}
document.querySelector('.panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; closeSheet();
  if (b.dataset.go) { const g = b.dataset.go;
    if (g.startsWith('ob')) { S.mode = 'onboard'; S.ob = +g[2]; }
    else { S.mode = 'app'; if (g.startsWith('spend')) { S.tab = 'spend'; S.spendView = g.split('-')[1]; } else S.tab = g; }
    render(false); }
  if (b.dataset.persona) { S.persona = b.dataset.persona; S.mode = 'app'; S.tab = 'home'; render(false); }
  const sc = b.dataset.scen;
  if (sc) { S.mode = 'app';
    if (sc === 'pay') { S.tab = 'home'; render(false); payment(); }
    if (sc === 'income') { S.tab = 'home'; S.incomeIn = true; S.allocDone = false; render(false); openSheet('alloc'); }
    if (sc === 'settle') { S.tab = 'home'; S.settled = false; render(false); openSheet('settle'); }
    if (sc === 'withdraw') { S.tab = 'plan'; render(false); openSheet('withdraw'); }
    if (sc === 'ai') { S.tab = 'plan'; render(false); ask('오늘 얼마 더 써도 돼?'); }
  }
  if (b.id === 'gridBtn') { const g = document.getElementById('gridOv'); g.classList.toggle('on'); b.classList.toggle('on'); }
});

render(false);
</script>
</body>
</html>
