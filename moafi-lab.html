function projCard() {
  const d = D();
  // 축 눈금은 항상 10만 원 간격 4개(30만 폭). 기본은 60만·70만·80만·90만이고,
  // 월말 예상 지출이 범위를 벗어나면 예산이 축 안에 남는 한도에서 창 전체를 10만 원씩 옮긴다
  const B = S.budget, STEP = 100000;
  let lo = B - 2 * STEP;
  if (d.projSpend < lo) lo = Math.max(B - 3 * STEP, Math.floor(d.projSpend / STEP) * STEP);
  if (d.projSpend + 50000 > lo + 3 * STEP) lo = Math.min(B, Math.ceil((d.projSpend + 50000) / STEP) * STEP - 3 * STEP);
  lo = Math.max(0, lo);
  const axisMin = lo, axisMax = lo + 3 * STEP, ticks = [0, 1, 2, 3].map(k => lo + STEP * k);
  const ax = v => (v - axisMin) / (axisMax - axisMin) * 100;
  // 월말 예상 (검정 카드) — Figma 시안 값 그대로: 여백 29/27, 라벨 12/400 #8E8E8E, 금액 Urbanist 36/300 + "원 남아요" 16/300,
  // 설명 12/300 흰색 줄간격 16.8, 축은 60만부터 월말 예상 지출까지 6px 막대(오른쪽 끝 둥글게) + 12px 눈금(예산 2px)
  const under = d.proj >= 0;
  const clampAx = v => Math.max(0, Math.min(100, ax(v)));
  const proj = `<div class="card c-ink proj-card">
      <div class="pc-label">월말 예상 지출</div>
      <div class="pc-amount"><span class="pc-num">${won(d.projSpend)}</span><span class="pc-won">₩</span></div>
      <p class="pc-desc">지금까지 ${W(S.spent)} · 하루 평균 ${W(Math.round(S.spent / S.day / 100) * 100)}<br>이 속도면 월말에 예산보다 ${W(Math.abs(d.proj))} ${under ? '남아요' : '넘어요'} · ${d.left}일 남음</p>
      <div class="pc-axis ${under ? 'under' : 'over'}" role="img" aria-label="월말 예상 지출 ${won(d.projSpend)}원, 예산 ${won(S.budget)}원, ${won(Math.abs(d.proj))}원 ${under ? '남음' : '초과'}">
        <span class="pc-bud" style="left:${ax(S.budget)}%;transform:translateX(${S.budget === axisMin ? 0 : S.budget === axisMax ? -100 : -50}%)">예산</span>
        <i class="pc-track"></i>
        <i class="pc-bar" style="width:${clampAx(d.projSpend)}%"></i>
        ${ticks.map((v, k) => `<i class="pc-tick ${v === S.budget ? 'budget' : ''}" style="left:${ax(v)}%"></i><span class="pc-lab" style="left:${ax(v)}%;transform:translateX(${k === 0 ? 0 : k === 3 ? -100 : -50}%)">${man(v)}</span>`).join('')}
        <i class="pc-spark" style="left:${clampAx(d.projSpend)}%"></i>
      </div>
    </div>`;
  return proj;
}

/* 중간 목표 막대: 단계마다 금액 구간만큼 폭을 나눈 한 줄 막대. 지난 단계 = 검정, 지금 단계 = 채운 만큼 그라데이션, 남은 단계 = 회색 */
function stageBar(saved) {
  const goal = STAGES[STAGES.length - 1].a;
  let cur = STAGES.findIndex(s => saved < s.a); if (cur < 0) cur = STAGES.length - 1;
  const segs = STAGES.map((st, i) => { const from = i ? STAGES[i - 1].a : 0, w = (st.a - from) / goal * 100;
    const fill = Math.max(0, Math.min(1, (saved - from) / (st.a - from)));
    return `<div class="sb-seg" style="flex:${w} 1 0">
      <div class="sb-track ${fill >= 1 ? 'done' : ''}">${fill > 0 && fill < 1 ? `<i style="width:${fill * 100}%"></i>` : ''}</div>
      <div class="sb-amt num">${man(st.a)}</div><div class="sb-name ${i === cur ? 'now' : ''}">${i + 1} ${st.n}</div></div>`; }).join('');
  const nowX = Math.min(100, saved / goal * 100);
  return `<div class="sb" role="img" aria-label="중간 목표 ${STAGES.length}단계 중 ${cur + 1}단계, 지금 ${man(saved)}">
    <div class="sb-now" style="left:${nowX}%"><span>지금 ${man(saved)}</span></div>
    <div class="sb-row">${segs}</div></div>`;
}
function planActual() {
  const L = GOAL_LINE, n = L.months.length, X = i => 40 + i / (n - 1) * 258, Y = v => 150 - v / 5000000 * 130;
  const act = L.actual.map((v, i) => [X(i), Y(v)]);
  const smooth = pts => pts.reduce((d, p, i, a) => { if (!i) return `M${p[0]} ${p[1]}`; const p0 = a[i - 2] || a[i - 1], p1 = a[i - 1], p2 = p, p3 = a[i + 1] || p;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    return d + ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }, '');
  const last = act[act.length - 1], gi = L.actual.length - 1;
  const proj = [last]; let v = S.goalSaved; for (let i = gi + 1; i < n; i++) { v = Math.min(5000000, v + 350000); proj.push([X(i), Y(v)]); }
  const planNow = 5000000 * gi / (n - 1), gap = S.goalSaved - planNow;
  return { gap, svg:`<svg viewBox="0 0 305 176" width="100%" role="img" aria-label="계획 대비 실제 누적 저축. 현재 계획보다 ${won(Math.abs(gap))}원 ${gap < 0 ? '부족' : '앞섬'}">
    <defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8C2FF" stop-opacity=".9"/><stop offset="1" stop-color="#B8C2FF" stop-opacity="0"/></linearGradient></defs>
    ${[0,2500000,5000000].map(v => `<line x1="40" x2="298" y1="${Y(v)}" y2="${Y(v)}" stroke="#181818" stroke-opacity=".12" stroke-width=".75"/><text x="34" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="#606060" font-family="Urbanist">${v ? man(v) : 0}</text>`).join('')}
    <path d="${smooth(act)} L${last[0]} 150 L40 150Z" fill="url(#pa)"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n - 1)}" y2="${Y(5000000)}" stroke="#181818" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${smooth(proj)}" fill="none" stroke="#3269FF" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <path d="${smooth(act)}" fill="none" stroke="#181818" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#181818"/><circle cx="${last[0]}" cy="${last[1]}" r="10" fill="none" stroke="#181818" stroke-opacity=".25"/>
    <line x1="${last[0]}" x2="${last[0]}" y1="${Y(planNow)}" y2="${last[1]}" stroke="#181818" stroke-width="1"/>
    ${[0, gi, n - 1].map(i => `<text x="${X(i)}" y="168" font-size="9" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" fill="#606060" font-family="Urbanist">${L.months[i]}</text>`).join('')}
  </svg>` };
}

// AI 조언 시트 안에서 이어서 묻기
document.addEventListener('submit', e => { if (e.target.id !== 'aiSheetForm') return; e.preventDefault(); const i = document.getElementById('aiSheetInput'); if (i.value.trim()) ask(i.value, true); });
// AI 조언 시트: 손잡이를 위로 끌면 전체 화면, 아래로 끌면 원래 크기(원래 크기에서 더 내리면 닫기). 손잡이를 누르기만 하면 전환
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.sheet.ai .grab'); if (!g) return;
  const sh = document.getElementById('sheet'), y0 = e.clientY; let dy = 0;
  g.setPointerCapture(e.pointerId); sh.style.transition = 'none';
  const mv = ev => { dy = ev.clientY - y0; sh.style.transform = dy > 0 ? `translateY(${dy}px)` : ''; };
  const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
    sh.style.transition = ''; sh.style.transform = '';
    if (Math.abs(dy) < 6) S.aiFull = !S.aiFull;
    else if (dy < -30) S.aiFull = true;
    else if (dy > 30) { if (S.aiFull) S.aiFull = false; else return closeSheet('아래로 내림'); }
    sh.classList.toggle('full', !!S.aiFull); log('AI 조언 ' + (S.aiFull ? '전체 화면' : '기본 크기')); };
  g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
});
document.getElementById('aiDock').addEventListener('submit', e => { e.preventDefault(); const i = document.getElementById('aiInput'); ask(i.value || '오늘 얼마 더 써도 돼?'); i.value = ''; aiDock(false); });
document.querySelector('#aiDock [data-act="mic"]').innerHTML = ic('mic', 20);
document.querySelector('#aiDock .ai-fab').innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.8 2.9c.7 4.6 2.4 7.2 9.3 9.8c-6.9 2.6-8.6 5.2-9.3 9.8c-.7-4.6-2.4-7.2-9.3-9.8c6.9-2.6 8.6-5.2 9.3-9.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M20.2.6c.3 1.6.9 2.3 2.6 3.1c-1.7.8-2.3 1.5-2.6 3.1c-.3-1.6-.9-2.3-2.6-3.1c1.7-.8 2.3-1.5 2.6-3.1z" fill="currentColor"/></svg>';
// 펼친 입력창은 비어 있는 채로 포커스를 잃거나 질문을 보내면 다시 원형 버튼으로 접는다
function aiDock(open) { const d = document.getElementById('aiDock'); d.classList.toggle('open', open); d.querySelector('.ai-fab').setAttribute('aria-expanded', open); if (open) setTimeout(() => document.getElementById('aiInput').focus(), 460); }
document.getElementById('aiDock').addEventListener('focusout', () => setTimeout(() => { const d = document.getElementById('aiDock'); if (!d.contains(document.activeElement) && !document.getElementById('aiInput').value) aiDock(false); }, 120));

/* ---------- side panel ---------- */
function renderPanel() {
  const cur = S.mode === 'onboard' ? 'ob' + S.ob : S.sub === 'diag' ? 'diag' : S.sub === 'link' ? 'link' : !S.linked && S.tab === 'home' ? 'empty' : S.tab === 'spend' ? 'spend-' + S.spendView : S.tab === 'plan' ? 'plan-' + S.planView : S.tab === 'learn' ? 'learn-' + S.learnView : S.tab;
  const sc = [ ['ob0','진단 시작'], ['ob1','자기평가'], ['ob2','진단 문항'], ['ob3','진단 결과'], ['diag','내 진단 결과'], ['link','계좌 연동 · 용도 확인'], ['empty','홈 · 연동 전'], ['home','홈'], ['spend-list','지출 · 가계부'], ['spend-analysis','지출 · 분석·영수증'], ['spend-budget','지출 · 예산'], ['plan-bank','자산 · 통장'], ['plan-goal','자산 · 목표'], ['plan-rule','자산 · 자동 설정'], ['learn-bite','지식 · 경제 개념'], ['learn-tips','지식 · 팁과 소식'], ['benefit','혜택'] ];
  document.getElementById('navScreens').innerHTML = sc.map(([k, n]) => `<button type="button" class="${cur === k ? 'on' : ''}" data-go="${k}">${n}</button>`).join('');
  document.getElementById('navPersona').innerHTML = Object.entries(PERSONA).map(([k, p]) => `<button type="button" class="${S.persona === k ? 'on' : ''}" data-persona="${k}">${p.name}</button>`).join('');
  document.getElementById('navTheme').innerHTML = [['dark', '다크 · 검은 유리'], ['light', '라이트 · 밝은 유리']].map(([k, n]) => `<button type="button" class="${(S.navTheme || 'dark') === k ? 'on' : ''}" data-navtheme="${k}">${n}</button>`).join('');
  document.getElementById('navScen').innerHTML = [ ['pay','결제 발생 → 실시간 피드백'], ['income','외주비 입금 → 배분'], ['settle','더치페이 정산'], ['withdraw','저축 인출 확인'], ['ai','AI 조언 묻기'] ].map(([k, n]) => `<button type="button" data-scen="${k}">${n}</button>`).join('');
}
function glassMap(w, h, band) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), d = x.createImageData(w, h), r = h / 2;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const px = i + .5, py = j + .5, cx = Math.min(Math.max(px, r), w - r), vx = px - cx, vy = py - r, len = Math.hypot(vx, vy) || 1, dist = r - len;
    let dx = 0, dy = 0; if (dist >= 0 && dist < band) { const t = Math.pow(1 - dist / band, 1.6); dx = -vx / len * t; dy = -vy / len * t; }
    const o = (j * w + i) * 4; d.data[o] = 128 + dx * 127; d.data[o + 1] = 128 + dy * 127; d.data[o + 2] = 128; d.data[o + 3] = 255;
  }
  x.putImageData(d, 0, 0); return c.toDataURL();
}
function segGlass() {
  const u = view.querySelector('.utabs'); if (!u) return;
  let f = document.getElementById('liquidGlassSeg');
  if (!f) { const base = document.getElementById('liquidGlass'); if (!base) return; f = base.cloneNode(true); f.id = 'liquidGlassSeg'; f.querySelector('feImage').id = 'lgMapSeg'; base.parentNode.appendChild(f); }
  const w = Math.round(u.offsetWidth), h = Math.round(u.offsetHeight); if (!w || !h || segGlass.k === w + 'x' + h) return; segGlass.k = w + 'x' + h;
  const url = glassMap(w, h, 10), im = f.querySelector('feImage');
  im.setAttribute('href', url); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
  ['width', 'height'].forEach((k, n) => { f.setAttribute(k, n ? h : w); im.setAttribute(k, n ? h : w); });
  f.querySelectorAll('feDisplacementMap').forEach((m, k) => m.setAttribute('scale', [20, 21, 22][k] || 20));
}
function liquidMap() {
  const tb = document.getElementById('tabbar'), f = document.getElementById('liquidGlass'), im = document.getElementById('lgMap');
  if (!tb || !f || !im) return; const w = Math.round(tb.offsetWidth), h = Math.round(tb.offsetHeight); if (!w || !h) return;
  if (liquidMap.k === w + 'x' + h) return; liquidMap.k = w + 'x' + h;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), d = x.createImageData(w, h), r = h / 2, band = 14;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const px = i + .5, py = j + .5, cx = Math.min(Math.max(px, r), w - r), vx = px - cx, vy = py - r, len = Math.hypot(vx, vy) || 1, dist = r - len;
    let dx = 0, dy = 0;
    if (dist >= 0 && dist < band) { const t = Math.pow(1 - dist / band, 1.6); dx = -vx / len * t; dy = -vy / len * t; }
    const o = (j * w + i) * 4; d.data[o] = 128 + dx * 127; d.data[o + 1] = 128 + dy * 127; d.data[o + 2] = 128; d.data[o + 3] = 255;
  }
  x.putImageData(d, 0, 0); const url = c.toDataURL();
  im.setAttribute('href', url); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
  ['width', 'height'].forEach((k, n) => { f.setAttribute(k, n ? h : w); im.setAttribute(k, n ? h : w); });
}
new ResizeObserver(liquidMap).observe(document.getElementById('tabbar'));
// 탭바 테마 비교: 화면 상태는 그대로 두고 탭바 모양만 바꾼다
document.getElementById('navTheme').addEventListener('click', e => {
  const b = e.target.closest('[data-navtheme]'); if (!b) return; e.stopPropagation();
  S.navTheme = b.dataset.navtheme; document.getElementById('tabbar').classList.toggle('light', S.navTheme === 'light'); document.querySelector('.screen').classList.toggle('nav-light', S.navTheme === 'light'); renderPanel();
});
document.querySelector('.panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; closeSheet(); S.sub = null; S.from = null;
  if (b.dataset.go) { const g = b.dataset.go;
    if (g === 'diag') { S.mode = 'app'; S.sub = 'diag'; }
    else if (g === 'link') { S.mode = 'app'; S.sub = 'link'; }
    else if (g === 'empty') { S.mode = 'app'; S.linked = false; S.tab = 'home'; }
    else if (g.startsWith('ob')) { S.mode = 'onboard'; S.ob = +g[2]; }
    else { S.mode = 'app'; S.linked = true; S.explored.add({ spend:'spend', plan:'save', benefit:'tax' }[g.split('-')[0]]); if (g.startsWith('spend')) { S.tab = 'spend'; S.spendView = g.split('-')[1]; } else if (g.startsWith('plan')) { S.tab = 'plan'; S.planView = g.split('-')[1]; } else if (g.startsWith('learn')) { S.tab = 'learn'; S.learnView = g.split('-')[1]; } else S.tab = g; }
    render(false); }
  if (b.dataset.persona) { S.persona = b.dataset.persona; S.focus = FOCUS_BY_PERSONA[S.persona]; S.explored = new Set(); S.biteOpen = {}; S.planMore = false; S.mode = 'app'; S.tab = 'home'; render(false); }
  const sc = b.dataset.scen;
  if (sc) { S.mode = 'app'; S.linked = true;
    if (sc === 'pay') { S.tab = 'home'; render(false); payment(); }
    if (sc === 'income') { S.tab = 'home'; S.incomeIn = true; S.allocDone = false; render(false); openSheet('alloc'); }
    if (sc === 'settle') { S.tab = 'home'; S.settled = false; render(false); openSheet('settle'); }
    if (sc === 'withdraw') { S.tab = 'plan'; S.planView = 'bank'; render(false); openSheet('withdraw'); }
    if (sc === 'ai') { S.tab = 'spend'; S.spendView = 'budget'; render(false); ask('오늘 얼마 더 써도 돼?'); }
  }
  if (b.id === 'gridBtn') { const g = document.getElementById('gridOv'); g.classList.toggle('on'); b.classList.toggle('on'); }
});

render(false);
