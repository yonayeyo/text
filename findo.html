<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="theme-color" content="#FAFAFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fin.do">
<meta name="format-detection" content="telephone=no">
<title>Fin.do 청년 금융 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%9C%A6&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:ELSH,wght@0..100,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  LAYOUT GUIDE — 393 × 852 (iPhone 15/16)
  · 4 columns · margin 20 · gutter 12 · content width 353
  · spacing scale (4pt): 4 / 8 / 12 / 16 / 24 / 32 / 40
      – inside a group 8 · between cards 12 · card padding 24 · between sections 40
  · type scale (hierarchy by size, single weight 500):
      Pretendard 18 / 16 / 14 / 12 / 10 · numerals (Urbanist) 56 / 48 / 32 / 24 · display (Aftersick DEMO → Bodoni Moda) 17 / 34
      line-height 1.45 for Korean text, 1 for numerals
  · radius: card 32 (corner smoothing) · sheet 32 · button & chip 999 · icon button = circle
  · icons: 24 box, 1.5px line
*/
:root{
  --ink:#181818; --g6:#606060; --g3:#DEDEDE; --paper:#FCFCFC; --bg:#FAFAFA;
  --g8:#2B2B2B; --g4:#9C9C9C; --g2:#EFEFEF;
  /* 포인트 컬러: 네이비 #081F40 · 슬레이트 #424F62 · 블루 #B5CBFF · 페일 블루 #D5E3FF */
  --navy:#081F40; --slate:#424F62; --blue:#B5CBFF; --pale:#D5E3FF;
  --warn:#FF60E4;   /* 경고: 알림 점 · 예산 초과 · 마감 임박 · 지출 증가 */
  --sky:var(--blue); --rose:var(--warn);
  --aura:linear-gradient(120deg,#D5E3FF 0%,#B5CBFF 100%);
  --f-kr:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --f-num:"Urbanist","Pretendard Variable",system-ui,sans-serif;
  --f-disp:"Aftersick DEMO","Aftersick","Bodoni Moda",Didot,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --m:20px; --gut:12px; --r:32px;
  --fg:var(--ink); --inv:var(--paper); --mute:var(--g6); --line:var(--g3); --surface:var(--paper);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E7E7E5}
body{font-family:var(--f-kr);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input{font:inherit;color:inherit}
svg{display:block}
.num,.n56,.n32,.n24,.n20{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{min-height:100vh;display:flex;gap:48px;justify-content:center;align-items:flex-start;padding:40px 16px 64px}
.panel{width:280px;position:sticky;top:40px;display:grid;gap:24px;font-size:13px;color:var(--ink)}
.panel h1{font-family:var(--f-disp);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.01em}
.panel .lead{color:var(--g6);font-size:13px;line-height:1.55}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--g6);margin-bottom:8px;font-weight:500}
.panel .pl{display:flex;flex-wrap:wrap;gap:6px}
.panel .pl button{height:32px;padding:0 12px;border-radius:999px;background:var(--paper);border:1px solid var(--g3);font-size:12px}
.panel .pl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel .spec{font-family:var(--f-mono);font-size:11px;color:var(--g6);line-height:1.7}

.device{width:413px;height:872px;padding:10px;border-radius:64px;background:#0E0E0E;box-shadow:0 0 0 2px #3a3a3a inset,0 30px 60px -20px rgba(0,0,0,.35);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:var(--bg);isolation:isolate}
@media (max-width:760px){
  .stage{flex-direction:column;align-items:center;padding:0 0 48px;gap:32px}
  .device{width:100%;max-width:413px;height:852px;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .panel{position:static;width:auto;max-width:393px;padding:0 16px}
}
.log{font-family:var(--f-mono);font-size:11px;line-height:1.6;max-height:280px;overflow:auto;padding:12px 16px;border-radius:20px;background:var(--g2);-webkit-user-select:text;user-select:text;white-space:pre-wrap}

/* ---------- screen chrome ---------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;background:linear-gradient(var(--page) 78%,transparent);padding:16px 30px 0 40px;display:flex;justify-content:space-between;font-size:16px;z-index:30;pointer-events:none;color:var(--fg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:999px;background:#000;z-index:31}
.screen{--page:var(--bg)}.screen.dark{--page:var(--ink);background:var(--ink)}
/* 탭 화면 최상단(머리말 + 세부 탭)은 스크롤해도 위에 고정 */
.shead{position:sticky;top:calc(-1 * var(--vt));z-index:5;margin:calc(-1 * var(--vt)) calc(-1 * var(--m)) 0;padding:var(--vt) var(--m) 0;background:var(--page)}
.shead .utabs{background:var(--page)}
.view{--vt:59px;position:absolute;inset:0;z-index:1;overflow-y:auto;scrollbar-width:none;padding:var(--vt) var(--m) 160px;color:var(--fg);background:transparent}
.view::-webkit-scrollbar{display:none}
.screen.dark{--fg:var(--paper);--inv:var(--ink);--mute:var(--g4);--line:#3A3A3A;--surface:#222}
.halftone{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--ink) 1.1px,transparent 1.5px);background-size:5px 5px;
  -webkit-mask-image:linear-gradient(transparent,rgba(0,0,0,.55) 70%,#000);mask-image:linear-gradient(transparent,rgba(0,0,0,.55) 70%,#000);opacity:.55}
.screen.dark .halftone{background-image:radial-gradient(circle,#FCFCFC 1px,transparent 1.4px);opacity:.25}
.screen.nonav .halftone{display:none}
/* 도트 무늬는 화면에 고정하지 않고 스크롤 맨 끝(콘텐츠 아래)에 붙인다 */
.halftone{display:none}
.ht-end{margin:0 calc(-1 * var(--m));pointer-events:none}
.keeps{display:grid;gap:4px}
.keeps .kr{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;min-height:40px}
.pick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--g4);flex:none}
/* 해 볼 제안: 미선택 = 흰 배경 + 얇은 점선, 선택 = 검정 배경 + 체크 */
.cut{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:24px 20px;border-radius:20px;border:1px dashed var(--g4);background:var(--paper);color:var(--ink);--mute:var(--g6);text-align:left}
.cut.on{background:var(--ink);color:var(--paper);border:1px solid var(--ink);--mute:var(--g4)}
.cut.on .pick{background:var(--paper);color:var(--ink);box-shadow:none}
.stepn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-num);font-size:12px;box-shadow:inset 0 0 0 1px currentColor;margin-right:8px;vertical-align:1px}

/* ---------- type ---------- */
.t18{font-size:18px}.t16{font-size:16px}.t14{font-size:14px}.t12{font-size:12px}.t10{font-size:10px}
.mute{color:var(--mute)}
.n56{font-family:var(--f-num);font-weight:300;font-size:56px;line-height:1;letter-spacing:-.02em}
.n48{font-family:var(--f-num);font-weight:300;font-size:48px;line-height:1;letter-spacing:-.01em}
/* 다음 행동 카드 */
.card.c-sky.na-card{background:linear-gradient(325deg,#B5CBFF 0%,#FBFCFD 100%);box-shadow:inset 0 0 23px #fff}
.na-head{display:flex;align-items:center;gap:8px;font-size:12px;line-height:17px;color:#6D6D6D}
.na-chip{height:17px;padding:0 6.5px;border-radius:21px;border:.5px solid #6D6D6D;font-size:10px;line-height:1;color:#6D6D6D;display:inline-flex;align-items:center}
.na-body{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:9px}
.na-title{font-size:20px;line-height:28px;color:#181818}
.na-desc{margin-top:5px;font-size:12px;line-height:16.8px;color:#646464}
.ib.na-go{width:44px;height:44px;background:#181818;color:#fff}
.na-wrap{display:grid;gap:8px;margin-bottom:8px;min-width:0}
/* 화면 오른쪽 여백까지 넓혀 다음 카드 끝이 보이게 */
.na-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-width:0;margin:0 calc(-1 * var(--m));padding:0 var(--m);scroll-padding:0 var(--m)}
.na-track::-webkit-scrollbar{display:none}
.na-dots{display:flex;justify-content:center;gap:6px;height:6px}
.na-dots i{position:relative;width:6px;height:6px;border-radius:50%;background:#D5E3FF;transition:background .25s;cursor:pointer}
.na-dots i::after{content:"";position:absolute;inset:-9px -5px}
.na-track.dragging{scroll-snap-type:none;cursor:grabbing;user-select:none}
.na-dots i.on{background:#B5CBFF}
.pt-lg{display:inline-block;width:10px;height:10px;border-radius:3px}
.na-track>.na-card{flex:0 0 100%;scroll-snap-align:start}
.na-track::after{content:"";flex:0 0 1px}
.card.na-done{background:#F1F1F1;box-shadow:inset 0 0 0 .5px #DEDEDE}
.na-done .na-title{color:var(--g6)}.na-done .na-desc{color:var(--g4)}
.na-chip.done{gap:3px;border-color:var(--g4);color:var(--g6)}
.ib.na-go.done{background:#FCFCFC;color:var(--g6);box-shadow:inset 0 0 0 1px var(--g3)}
@keyframes naIn{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
.gs-card{display:flex;flex-direction:column;align-items:stretch;text-align:left}
.gs-top{font-size:12px;line-height:17px;color:var(--mute)}
.gs-num{margin-top:8px;font-family:var(--f-num);font-weight:300;font-size:28px;line-height:32px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gs-won{font-family:var(--f-kr);font-weight:300;font-size:16px;line-height:1;margin-left:4px}
.gs-foot{margin-top:8px;height:16px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--mute)}
.gs-foot .glowbar{flex:1}
.na-why{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:400;color:var(--g6);padding:0 0 0 24px;line-height:18px}
.na-star{flex:none;font-family:"Noto Sans Symbols 2","Apple Symbols","Segoe UI Symbol",sans-serif;font-size:12px;line-height:18px}
/* 월말 예상 카드: 여백·라운드·배경은 다른 카드(c-ink)와 같고, 글자 굵기도 다른 카드와 같은 규칙(본문 500, 숫자 Urbanist 300) */
/* 라벨은 작은 하늘색 알약 안에 */
.proj-card .pc-label{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#D5E3FF;color:#181818;font-size:10px;line-height:1}
/* 라벨 ↔ 숫자 ↔ 설명 ↔ 그래프: 보이는 글자 기준 간격 14px로 동일 */
.proj-card .pc-amount{margin-top:3px;height:48px;display:flex;align-items:baseline}
.proj-card .pc-num{font-family:var(--f-num);font-size:36px;font-weight:300;line-height:48px}
.proj-card .pc-desc{margin-top:1px;font-size:12px;line-height:16.8px;font-weight:400;color:#BEBEBE}
.proj-card .pc-won{font-family:var(--f-kr);font-size:24px;font-weight:300;margin-left:12px}
.proj-card .pc-axis{position:relative;height:50px;margin-top:9px;--bar:#B5CBFF}
.proj-card .pc-axis.over{--bar:var(--warn)}
.proj-card .pc-bud{position:absolute;top:0;transform:translateX(-50%);font-size:10px;line-height:14px}
.proj-card .pc-track{position:absolute;left:0;right:0;top:24.25px;height:1.5px;background:rgba(252,252,252,.45)}
.proj-card .pc-bar{position:absolute;left:0;top:22px;height:6px;border-radius:0 8px 8px 0;background:linear-gradient(90deg,rgba(255,255,255,.38) 0%,var(--bar) 100%);box-shadow:0 0 14px 1px color-mix(in srgb,var(--bar) 55%,transparent)}
.proj-card .pc-tick{position:absolute;top:19px;width:1px;height:12px;margin-left:-.5px;background:#fff}
.proj-card .pc-tick.budget{width:2px;margin-left:-1px}
.proj-card .pc-lab{position:absolute;top:36px;font-size:10px;line-height:14px;color:var(--mute);white-space:nowrap}
.proj-card .pc-spark{position:absolute;top:25px;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0 2px,var(--bar) 3.5px,color-mix(in srgb,var(--bar) 40%,transparent) 7px,transparent 16px)}
.proj-card .pc-spark::before,.proj-card .pc-spark::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.proj-card .pc-spark::before{width:36px;height:2px;background:linear-gradient(90deg,transparent,var(--bar),#fff,var(--bar),transparent)}
.proj-card .pc-spark::after{width:2px;height:36px;background:linear-gradient(180deg,transparent,var(--bar),#fff,var(--bar),transparent)}
.n32{font-family:var(--f-num);font-weight:300;font-size:32px;line-height:1;letter-spacing:-.01em}
.n24{font-family:var(--f-num);font-weight:400;font-size:24px;line-height:1}
.n20{font-family:var(--f-num);font-weight:400;font-size:20px;line-height:1}
.disp{font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em}
.eng{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.cur{font-family:var(--f-num);font-weight:400;margin-left:.25em}

/* ---------- layout helpers ---------- */
.row{display:flex;align-items:center}.between{justify-content:space-between}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}
.stack{display:grid;gap:12px}.stack8{display:grid;gap:8px}.stack4{display:grid;gap:4px}
.sec{margin-top:40px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px}
/* 섹션 제목 아래 설명: 제목보다 가볍고 한 단계 밝은 회색 */
.sec-d{font-size:12px;font-weight:400;line-height:1.4;color:var(--g4);margin-top:4px}
.sec-h .t18{line-height:1.3}
.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}

/* ---------- cards ---------- */
.card{border-radius:20px;padding:24px 20px;position:relative;overflow:hidden}
@supports (corner-shape:superellipse(1.6)){.sheet{corner-shape:superellipse(1.6);border-radius:42px}}
.c-paper{background:#fff;box-shadow:inset 0 0 0 .5px #E5E5E5}
.c-ink{background:var(--ink);color:var(--paper);--fg:var(--paper);--inv:var(--ink);--mute:var(--g4);--line:#3A3A3A}
.c-light{background:var(--paper);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.screen.dark .c-ink{background:var(--paper);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.screen.dark .c-paper{background:#232323;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.c-sky{background:radial-gradient(90% 120% at 80% 100%,#B5CBFF 0%,#D5E3FF 45%,#FFFFFF 100%);color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:rgba(24,24,24,.14);box-shadow:inset 0 0 24px rgba(255,255,255,.9)}
/* 하늘색 그라데이션 카드는 행동 추천 카드처럼 0.5px 하늘색 테두리를 함께 쓴다 */
.card.c-sky{border:.5px solid #B5CBFF;background-origin:border-box}
/* 분홍·하늘이 섞인 카드는 배경 색 위치에 맞춰 왼쪽 위 분홍 → 오른쪽 아래 하늘로 이어지는 얇은 테두리.
   카드 자체의 border로 그려서 둥근 모서리(슈퍼엘립스) 곡률을 그대로 따른다 */
.card.c-aura{border:.75px solid transparent;
  background:radial-gradient(70% 80% at 0% 0%,rgba(255,255,255,.7),transparent 70%) padding-box,radial-gradient(90% 100% at 100% 100%,#B5CBFF,transparent 75%) padding-box,linear-gradient(#D5E3FF,#D5E3FF) padding-box,
    linear-gradient(135deg,#B5CBFF 0%,#D5E3FF 50%,#B5CBFF 100%) border-box}
.c-aura{background:radial-gradient(70% 80% at 0% 0%,rgba(255,255,255,.7),transparent 70%),radial-gradient(90% 100% at 100% 100%,#B5CBFF,transparent 75%),#D5E3FF;color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:rgba(24,24,24,.14);box-shadow:inset 0 0 24px rgba(255,255,255,.85)}
.c-glass{background:rgba(252,252,252,.62);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.8);color:var(--ink);--mute:var(--g6);--line:var(--g3)}
.c-dash{border:1.5px dashed var(--g3);background:var(--paper)}
.screen.dark .c-dash{border-color:#444;background:var(--ink)}

/* ---------- controls ---------- */
.btn{height:48px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;white-space:nowrap}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.btn.sm{height:36px;padding:0 16px;font-size:14px}
.btn.full{width:100%}
.screen.dark .btn:not(.light):not(.ghost):not(.pr-go){background:var(--paper);color:var(--ink)}
.c-ink .btn:not(.ghost){background:var(--paper);color:var(--ink)}
.screen.dark .c-ink .btn:not(.ghost){background:var(--ink);color:var(--paper)}
.ib{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative}
.ib.glass{background:rgba(252,252,252,.7);border:1px solid rgba(24,24,24,.06);backdrop-filter:blur(12px)}
.ib.ink{background:var(--ink);color:var(--paper)}
.ib.paper{background:var(--paper);color:var(--ink)}
.ib .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--paper)}
.chip{height:32px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--fg);color:var(--inv);box-shadow:none}
/* 페이지 머리말(지출·플랜·목표·혜택 공통) + 밑줄 탭(화면 폭 전체) + 기간 칩 */
.ph-title{font-size:18px;font-weight:500;line-height:26px}
.ph-sub{font-size:12px;font-weight:400;line-height:17px;color:var(--mute)}
.utabs{display:flex;margin:0 calc(-1 * var(--m)) 0;box-shadow:inset 0 -2px 0 var(--line);position:relative}
.utabs button{flex:1;height:40px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:14px;font-weight:400;line-height:17px;color:var(--mute);position:relative}
.utabs button.on{color:var(--fg);font-weight:600}
/* 밑줄은 하나만 두고 위치(--i)를 옮겨서, 세부 탭을 넘길 때 손가락을 따라 미끄러지게 */
.utabs::after{content:"";position:absolute;bottom:0;height:2px;background:var(--fg);width:calc(80% / var(--n,3));left:calc((var(--i,0) + .1) * 100% / var(--n,3));transition:left .34s cubic-bezier(.3,.7,.3,1)}
.utabs.drag::after{transition:none}
.sub-ghost{position:absolute;left:0;right:0;padding:0 var(--m);display:flow-root;pointer-events:none}
.utabs + .row,.shead + .row{margin-top:14px}
.chip.pchip{height:28px;padding:0 12px;font-size:12px;gap:4px;box-shadow:none;border:.5px solid var(--line)}
.screen.dark .chip.pchip{border-color:#595959}
.chip.pchip.on{border-color:transparent}
.tag{height:22px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:10px;white-space:nowrap}
.tag.ink{background:var(--fg);color:var(--inv)}
.tag.line{box-shadow:inset 0 0 0 1px var(--line)}
.tag.dash{border:1px dashed var(--g4)}
.tag.glow{background:var(--aura);color:var(--ink)}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(24,24,24,.06);gap:4px}
.screen.dark .seg{background:rgba(252,252,252,.1)}
.seg button{flex:1;height:36px;border-radius:999px;font-size:14px;color:var(--mute);padding:0 16px}
.seg button.on{background:var(--fg);color:var(--inv)}
.hair{height:1px;background:var(--line);border:0}
.term{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;box-shadow:inset 0 0 0 1px var(--mute);color:var(--mute);vertical-align:2px;margin-left:4px;font-family:var(--f-num)}
.term-def{display:none;margin-top:8px;padding:12px 16px;border-radius:20px;background:rgba(24,24,24,.05);font-size:12px;line-height:1.55;color:var(--mute)}
.term-def.open{display:block}
.c-ink .term-def{background:rgba(252,252,252,.08)}
.switch{width:44px;height:26px;border-radius:999px;background:var(--g3);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .2s}
.switch.on{background:var(--ink)}.switch.on::after{transform:translateX(18px)}
.screen.dark .c-paper .switch{background:#444}.screen.dark .c-paper .switch.on{background:var(--paper)}.screen.dark .c-paper .switch.on::after{background:var(--ink)}

/* ---------- nav & AI dock ---------- */
.tabbar{position:absolute;left:var(--m);right:var(--m);bottom:24px;height:64px;padding:8px;border-radius:999px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  /* 유리: 흐림(포그)은 줄이고 굴절·반사광을 살린다. 크롬은 SVG 굴절 필터, 사파리는 흐림+채도로 */
  background:rgba(17,17,17,.85);
  -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:url(#glassRefract) blur(8px) saturate(180%);
  box-shadow:inset 1px 1px 1.1px rgba(255,255,255,.52),inset -1px -1px 1.1px rgba(255,255,255,.52),inset 0 0 4px rgba(255,255,255,.9),0 10px 28px rgba(0,0,0,.22)}
/* 각 탭은 5칸 중 제자리에 고정. 활성 탭만 제자리에서 글자를 펼친다(다른 아이콘은 움직이지 않음) */
.tab{justify-self:center;height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:0;color:var(--paper);font-size:14px;padding:0 13px;transition:background .25s,padding .3s,gap .3s;position:relative}
.tab:first-child.on{justify-self:start}.tab:last-child.on{justify-self:end}
.tab span{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.tab.on{color:#181818;padding:0;width:88px;gap:4px;z-index:1;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(8px) saturate(160%);backdrop-filter:blur(8px) saturate(160%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(24,24,24,.08),inset 0 0 0 .5px rgba(255,255,255,.9),0 4px 14px rgba(0,0,0,.25)}
.tab.on span{max-width:56px;opacity:1}
.screen.nonav .tabbar,.screen.nonav .ai-dock{display:none}
.ai-dock{position:absolute;left:var(--m);right:var(--m);bottom:100px;height:56px;padding:8px;border-radius:999px;z-index:19;display:flex;align-items:center;gap:8px;
  background:none}
.ai-dock input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;outline:0;color:var(--ink)}
.ai-dock input::placeholder{color:var(--g6)}
.ai-dock .ib{background:rgba(24,24,24,.06);color:var(--ink)}
.ai-dock .ib.ink{background:var(--ink);color:var(--paper)}
.ai-dock[hidden]{display:none}
/* AI 입력창: 접힌 상태는 오른쪽 검정 원(= 크게 키운 전송 버튼) + 흐르는 그라데이션 테두리.
   누르면 ① 원이 전송 버튼 크기로 살짝 작아지며 AI 아이콘 → 전송 아이콘 ② 흰 유리 바가 오른쪽에서 왼쪽으로 열리고
   ③ 마이크·입력칸이 뒤따라 나타난다. 닫을 때는 역순 */
.ai-dock{--ease:cubic-bezier(.2,.8,.2,1)}
.ai-dock::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:999px;pointer-events:none;
  background:rgba(252,252,252,.72);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(24,24,24,.08);
  clip-path:inset(0 0 0 calc(100% - 56px) round 28px);opacity:0;transition:clip-path .42s var(--ease) .06s,opacity .2s .06s}
.ai-dock.open::after{clip-path:inset(0 0 0 0 round 28px);opacity:1}
.ai-dock:not(.open){pointer-events:none}
.ai-dock > .ib[data-act="mic"],.ai-dock > input{opacity:0;transform:translateX(16px);transition:opacity .18s,transform .3s var(--ease)}
.ai-dock.open > .ib[data-act="mic"],.ai-dock.open > input{opacity:1;transform:none;transition:opacity .26s .24s,transform .4s var(--ease) .2s}
.ai-dock > [type="submit"]{position:relative;z-index:1;transform:scale(1.4);transition:transform .28s var(--ease);
  box-shadow:inset 0 0 10px rgba(0,0,0,.6),0 0 12px rgba(181,203,255,.22)}
.ai-dock.open > [type="submit"]{transform:scale(1);box-shadow:none}
.ai-dock > [type="submit"] svg{opacity:0;transform:rotate(-90deg) scale(.6);transition:opacity .2s,transform .28s var(--ease)}
.ai-dock.open > [type="submit"] svg{opacity:1;transform:none;transition-delay:.08s}
.ai-fab{position:absolute;right:0;top:0;z-index:3;width:56px;height:56px;border-radius:50%;padding:0;color:var(--paper);pointer-events:auto;transition:opacity .2s,transform .28s var(--ease)}
.ai-dock.open .ai-fab{opacity:0;transform:rotate(90deg) scale(.6);pointer-events:none}

.ai-dock > [type="submit"]::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.1px;pointer-events:none;
  background:linear-gradient(120deg,#081F40,#B5CBFF,#081F40,#B5CBFF,#081F40) 0 0/300% 300%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:aiGlint 4s linear infinite;transition:opacity .2s}
.ai-dock.open > [type="submit"]::before{opacity:0}
@keyframes aiGlint{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.ai-dock > [type="submit"]::before{animation:none}.ai-dock *,.ai-dock::before,.ai-dock::after{transition:none!important}}

/* ---------- sheet & toast ---------- */
.layer{position:absolute;inset:0;z-index:40;background:rgba(24,24,24,.36);backdrop-filter:blur(6px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.layer.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:88%;overflow-y:auto;scrollbar-width:none;background:var(--bg);color:var(--ink);border-radius:32px 32px 0 0;padding:16px var(--m) 40px;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:var(--g3)}
.layer.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g3);margin:0 auto 16px}
.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%) scale(.6);width:124px;height:40px;border-radius:24px;background:#000;color:var(--paper);z-index:45;opacity:0;overflow:hidden;transition:all .45s cubic-bezier(.2,.9,.2,1);padding:0}
.toast.open{opacity:1;width:369px;height:auto;transform:translateX(-50%);padding:16px 20px;border-radius:32px}
.toast-in{opacity:0;transition:opacity .2s .2s}.toast.open .toast-in{opacity:1}

/* ---------- home ---------- */
.urgent{width:100%;height:48px;margin-top:16px;border-radius:999px;padding:0 6px 0 20px;display:flex;align-items:center;gap:8px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--g3)}
.ib.ring{animation:ring .5s ease-out}
@keyframes ring{30%{transform:scale(1.12) rotate(-8deg)}60%{transform:scale(1.04) rotate(6deg)}}
.urgent .u-dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:none}
.urgent .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.hero{text-align:center;margin-top:32px}
/* 라벨 ↔ 숫자 ↔ 남은 예산: 글자 기준 실제 간격이 모두 16px이 되도록(숫자 줄 높이 안의 여백 포함) */
.hero-n{display:flex;justify-content:center;align-items:baseline;gap:8px;margin:6px 0 6px}
.meter{margin-top:24px;position:relative}
.meter .bars{display:flex;justify-content:space-between;height:44px}
.meter .bars i{width:2px;background:var(--ink);border-radius:1px}
.meter .bars i.off{background:var(--g3)}
.meter .bars i.now{width:3px;background:var(--sky);box-shadow:0 0 8px 2px rgba(181,203,255,.9)}
.meter .lbl{position:relative;display:flex;height:14px;margin-top:4px}
.meter .lbl .tk{position:absolute;top:0;white-space:nowrap}
.meter .mk{position:absolute;top:-20px;white-space:nowrap}
.glowbar{height:12px;border-radius:999px;background:rgba(24,24,24,.08);position:relative}
.glowbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#B5CBFF,#081F40)}
.glowbar i::after{content:"";position:absolute;inset:-6px;border-radius:999px;background:inherit;filter:blur(10px);opacity:.75;z-index:-1}
.glowbar.flat i::after{display:none}
/* 어두운 화면은 몰입 화면(진단 결과·영수증)에만: 지출 탭은 밝게 두고 영수증 구간만 어두운 띠로 */
.dark-band{margin-left:calc(-1 * var(--m));margin-right:calc(-1 * var(--m));padding:32px var(--m) 40px;background:#181818;color:var(--paper);--fg:var(--paper);--mute:var(--g4);--line:#3A3A3A}
.goal-row{width:100%;text-align:left;display:flex;flex-direction:column;align-items:flex-start}
.acct-list{padding:4px 20px}
.acct-row{width:100%;display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;padding:16px 0;text-align:left}
.acct-row + .acct-row{border-top:1px solid var(--line)}
.acct-dot{width:10px;height:10px;border-radius:3px}
.acct-t{display:grid;gap:3px;min-width:0}
.acct-row .acct-dot{align-self:start;margin-top:5px}
.acct-use{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 14px;border-radius:999px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.use-opt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 4px;text-align:left;font-size:15px}
.use-opt + .use-opt{border-top:1px solid var(--line)}
.empty-card{text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center}
/* 지금 집중할 영역 (홈) · 탭 제목 옆 단계 표시 · 탭바 점 */
.focus-strip{width:100%;padding:24px 20px;text-align:left}
.fs-head{width:100%;display:flex;align-items:center;gap:12px;text-align:left}
.fs-tasks{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fs-task{width:100%;display:flex;align-items:center;gap:10px;padding:9px 0 3px;text-align:left}
.fs-task .t14{flex:1}
.fs-chk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--g3)}
.fs-task.done .fs-chk{background:var(--fg);color:var(--inv);box-shadow:none}
.fs-task.done .t14{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--g3)}
/* 단계형 공개: 집중 영역이 아닌 탭은 요약 한 장으로 먼저 보여 준다 */
.pv-list{display:grid}
.pv-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:14px 0;text-align:left;width:100%}
.pv-row + .pv-row{border-top:1px solid var(--line)}
.shead + .focus-strip{margin-top:16px}
.fs-txt{display:grid;gap:2px;flex:none}
.fs-steps{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.fs-steps>i{width:10px;height:1px;background:var(--g3);flex:none}
.fs-step{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--mute);white-space:nowrap}
.fs-step b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:500;box-shadow:inset 0 0 0 1px var(--g3)}
.fs-step.on{color:var(--fg)}
.fs-step.on b{background:var(--fg);color:var(--inv);box-shadow:none}
.ph-tag{vertical-align:middle;margin-left:8px;position:relative;top:-3px;height:20px;font-weight:400;letter-spacing:0}
button.ph-tag{color:var(--mute)}
/* 한 입 금융 */
.bite{padding:24px 20px}
/* 카드 색 규칙 — 검정: 현재 상황 · 하늘색: 제안 · 그라데이션: 목표·보상 · 연회색: 한 입 지식 · 흰색: 기본 정보 · 점선: 아직 없음 */
.c-know{background:#F1F1F1;color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:#DADADA}
.screen.dark .c-know{background:#262626;color:var(--paper);--fg:var(--paper);--inv:var(--ink);--mute:var(--g4);--line:#3A3A3A}
.screen.dark .sheet .c-know{background:#F1F1F1;color:var(--ink);--fg:var(--ink);--inv:var(--paper);--mute:var(--g6);--line:#DADADA}
.screen.dark .c-know .bb-track{background:rgba(252,252,252,.12)}.screen.dark .sheet .c-know .bb-track{background:rgba(24,24,24,.08)}
.warn-dot{width:6px;height:6px;border-radius:50%;background:var(--rose);display:inline-block;margin-right:6px}
.bite-h{display:grid;grid-template-columns:1fr auto;gap:6px 12px;width:100%;text-align:left;align-items:center}
.bite-k{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.bite-q{line-height:1.4}
.bite-tg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}

/* 플랜-예산 상단 요약: 카드 없이 화면 바탕 위에 가볍게 */

/* ---------- receipt ---------- */
.printer{margin-top:24px}
/* 영수증 입구(Figma 372×57): 금속 바깥 틀 + 반투명 안쪽 판 + 가운데 출구 선. 종이는 출구 선 가운데에서 나온다 */
.slot{height:57px;border-radius:12px;position:relative;z-index:1;border:2px solid transparent;
  background:linear-gradient(180deg,#909090 0%,#F3F3F3 21%,#666464 75%,#767676 100%) padding-box,linear-gradient(180deg,#CACACA 0%,#686A69 50%,#5E5E5E 100%) border-box}
.slot::before{content:"";position:absolute;left:4.4px;right:4.4px;top:2.25px;height:48.9px;border-radius:7px;
  background:linear-gradient(180deg,rgba(177,176,176,.7) 0%,rgba(233,233,233,.7) 27%,rgba(212,212,212,.7) 84%,rgba(185,183,183,.7) 100%)}
.slot::after{content:"";position:absolute;left:13.9px;right:13.9px;top:23.5px;height:7.44px;border-radius:22px;border:1px solid #CACACA;
  background:linear-gradient(180deg,#909090 0%,#1F1F1F 27%,#5E5E5E 64%,#F3F3F3 89%,#767676 100%)}
@keyframes blink{50%{opacity:.2}}
.feed{margin:-25.5px 20px 0;clip-path:inset(0 -100vw -100vh);padding-bottom:12px;position:relative;z-index:2}
.feed::before{content:"";position:absolute;left:0;right:0;top:0;height:26px;background:linear-gradient(rgba(0,0,0,.22),transparent);z-index:2;pointer-events:none}
.paper{background:linear-gradient(90deg,#F1F1F1,#FCFCFC 6%,#FCFCFC 94%,#F1F1F1);color:var(--ink);font-family:var(--f-mono);font-size:12px;line-height:1.6;padding:36px 20px 24px;position:relative;--mute:#7A7A7A;--line:#CFCFCF}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:conic-gradient(from -45deg at bottom,#FCFCFC 90deg,transparent 0) 50%/12px 100%}
.printer.printing .paper{animation:feed 2.2s cubic-bezier(.33,.1,.25,1) both}
/* 뜯기: 영수증을 옆으로 당기면 출구 쪽을 축으로 기울고, 놓으면 뜯겨 떨어진다 */
.feed{touch-action:pan-y}
.paper{transform-origin:50% 0}
.tear-line{position:absolute;left:0;right:0;top:11px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--mute);font:inherit;font-size:10px;letter-spacing:.04em;white-space:nowrap}
.tear-line::before,.tear-line::after{content:"";flex:1;border-top:1px dashed var(--line)}
.printer.torn .feed{clip-path:none}
.printer.torn .feed::before{opacity:0}
.printer.torn .paper{-webkit-mask:conic-gradient(from 135deg at top,#000 90deg,transparent 0) 50% 0/10px 6px repeat-x,linear-gradient(#000 0 0) 0 5px/100% calc(100% - 5px) no-repeat;
  mask:conic-gradient(from 135deg at top,#000 90deg,transparent 0) 50% 0/10px 6px repeat-x,linear-gradient(#000 0 0) 0 5px/100% calc(100% - 5px) no-repeat}
.pr-go.pr-in{animation:prIn .35s ease-out both}
@keyframes prIn{from{opacity:0;transform:translateY(-6px)}}
.screen .btn.pr-go{display:flex;width:fit-content;margin:16px auto 0;padding:0 28px;gap:6px;font-size:14px;background:#000;color:#FCFCFC;box-shadow:inset 0 0 0 1px #3A3A3A}
@keyframes feed{from{transform:translateY(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.printer.printing .paper{animation:none}.toast,.layer,.sheet{transition:none}}

/* 휴대폰에서 열면 기기 프레임·패널 없이 전체 화면 앱으로 동작 (사용성 테스트용) */
@media (max-width:520px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
  body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
  .stage{display:block;min-height:0;padding:0}
  .panel{display:none}
  .device{position:fixed;inset:0;width:100%;max-width:none;height:100%;padding:0;border-radius:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .island,.statusbar>*{display:none!important}
  /* iOS Safari는 화면 맨 위에 붙은 position:fixed 요소의 단색 배경을 읽어 상단(상태바) 색을 정한다 */
  .statusbar{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 4px);padding:0;background:none;background-color:var(--bg)}
  .view{--vt:calc(env(safe-area-inset-top,0px) + 4px);padding-top:var(--vt);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  /* 하단 여백: 홈 인디케이터가 있는 기기는 안전 영역과 일부 겹치게(34 → 20px), 홈 버튼 기기는 12px */
  .screen{--nav-gap:max(12px, calc(env(safe-area-inset-bottom,0px) - 14px))}
  .tabbar{bottom:var(--nav-gap)}
  .ai-dock{bottom:calc(var(--nav-gap) + 76px)}
  .ai-dock input{font-size:16px}
  .toast{top:calc(env(safe-area-inset-top,0px) + 8px)}
  .toast.open{width:calc(100% - 24px)}
  .sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
  .ob-col{min-height:calc(100dvh - env(safe-area-inset-top,0px) - 40px)}
  .res-sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px)}
  button:active,.opt:active,.cut:active{transform:scale(.97);transition:transform .08s}
}
/* 홈 (시안 4): 머리말 아래 구분선 · 오늘 쓸 수 있는 금액 · 오늘의 실천 항목 궤도 */
.shead:has(> .home-top){box-shadow:inset 0 -1px 0 #EDEDED}
.top.home-top{padding-bottom:12px}
.h-hero{position:relative;margin-top:12px;display:grid;gap:1px}
.h-hero .h-lb{font-size:14px;font-weight:500;color:#999;line-height:14px}
.h-hero .h-sb{font-size:10px;font-weight:400;color:#999}
.h-hero .rw{display:flex;align-items:center;gap:12px}
.h-hero .hl{flex:1;height:1px;background:var(--g4)}
.h-hero .ib{background:#181818}
/* Bitcount 숫자는 글자 상자 안에서 위쪽에 그려져서, 선·버튼을 숫자 가운데(3.5px 위)에 맞춘다 */
.h-hero .hl,.h-hero .rw .ib{transform:translateY(-3.5px)}
.dotnum{font-family:"Bitcount Grid Single",var(--f-num);font-weight:400;font-size:47px;line-height:1;color:#000;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 오늘의 실천 항목 궤도 — 시안 좌표(402 프레임, y 170 기준) · 카드 80 × 100 · 모서리 9 · 왼쪽 위 기준 ±5° 회전 */
.orbit-wrap{margin:8px calc(-1 * var(--m)) 0;overflow:hidden}
.orbit{position:relative;width:393px;height:440px;margin-left:calc(50% - 196.5px)}  /* 시안 좌표 기준 폭 393으로 고정하고 화면 가운데에 둔다 */
.orbit .deco{position:absolute;border-radius:50%;background:#000;pointer-events:none}
.pc{position:absolute;width:80px;height:100px;border-radius:9px;display:grid;place-items:center;padding:8px;text-align:center;font-size:14px;font-weight:400;line-height:1.35;color:#000;transform:rotate(var(--rot));transform-origin:top left;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.pc:active{transform:rotate(var(--rot)) scale(.95)}
/* 완료 */
.pc.done{background:#181818;color:#fff;box-shadow:0 1px 12px rgba(104,160,234,.54)}
/* 아직 못한 것 (알지만 실천 못함) */
.pc.todo{background:radial-gradient(ellipse 50% 50% at 50% 50%,#FAFAFA 60%,#EFF3FF 100%);border:.5px solid rgba(78,132,202,.24)}
/* 새 항목 */
.pc.new{background:#FBFBFB;border:.5px solid #000}
.orbit .oc{position:absolute;left:50%;top:183px;transform:translateX(-50%);width:168px;text-align:center}
.orbit .oc .ow{font-family:"Bitcount Grid Single",var(--f-num);font-weight:400;font-size:30px;line-height:36px;color:#000}
.orbit .oc .ot{font-size:14px;font-weight:500;color:#999}
.orbit .oc .od{font-size:10px;font-weight:400;line-height:14px;color:#999;margin-top:2px}
.dot-h{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:12px}
.dot-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
/* 알기 탭: 상단 입력창 · 개념 원반 · 홈 '?' 알아볼 것 조각 */
.ai-fab svg{display:block;margin:auto}
.screen .ai-dock:not(.open) > [type="submit"]{background:rgba(17,17,17,.85);box-shadow:inset 1px 1px 1.1px rgba(255,255,255,.52),inset -1px -1px 1.1px rgba(255,255,255,.52),inset 0 0 4px rgba(255,255,255,.9)}
.screen .ai-dock:not(.open) > [type="submit"]::before{display:none}
/* 알기 › 한입 금융 (시안 13) */
.lr-sum{position:relative;margin-top:16px;padding-right:56px}
.lr-sum .k{font-size:14px;color:#999}
.lr-sum .v{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.lr-sum .v b{font-family:"Bitcount Grid Single",var(--f-num);font-weight:400;font-size:28px;line-height:1;color:#000}
.lr-sum .v span{font-size:10px;color:#999}
.lr-sum .ib{position:absolute;right:0;top:50%;transform:translateY(-50%);background:#181818}
.lr-new{margin-top:24px;font-size:14px;color:#999}
.lr-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px calc(-1 * var(--m)) 0;padding:0 var(--m)}
.lr-chips::-webkit-scrollbar{display:none}
.lr-chips button{flex:none;height:22px;padding:0 8px;border-radius:999px;font-size:12px;color:#999;box-shadow:inset 0 0 0 .5px #C4C4C4;white-space:nowrap}
.lr-chips button.on{background:#000;color:#fff;box-shadow:none}
.lr-list{display:flex;flex-direction:column;gap:28px;margin-top:16px;padding-left:10px}
.lr-row{display:flex;align-items:center;width:100%;text-align:left}
.lr-row .th{flex:none;display:grid;place-items:center;color:#181818;width:100px;height:100px;margin:0 20px;border-radius:50px;background:#D9D9D9;transition:width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1),margin .32s cubic-bezier(.2,.8,.2,1),border-radius .32s cubic-bezier(.2,.8,.2,1)}
.lr-row .tx{display:grid;gap:4px;min-width:0;margin-left:0;transition:margin .32s cubic-bezier(.2,.8,.2,1)}
.lr-row.on .th{width:140px;height:140px;margin:0;border-radius:32px}
.lr-row .th svg{width:32px;height:32px;opacity:.9;transition:width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1)}
.lr-row.on .th svg{width:44px;height:44px}
/* 영역별 썸네일 그라데이션 (시안 14: 어두운 슬레이트 · 네이비 · 청록 · 남색) + 파란 빛 그림자 */
.lr-row .th{color:#fff;box-shadow:0 1px 12px rgba(181,203,255,.35)}
.th.a-spend{background:linear-gradient(150deg,#424F62 0%,#081F40 100%)}
.th.a-save{background:radial-gradient(circle at 50% 50%,#081F40 0%,#424F62 100%)}
.th.a-credit{background:radial-gradient(circle at 50% 50%,#424F62 0%,#081F40 100%)}
.th.a-insure{background:linear-gradient(150deg,#B5CBFF 0%,#424F62 100%)}
.th.a-tax{background:radial-gradient(circle at 50% 45%,#B5CBFF 0%,#424F62 60%,#081F40 100%)}
.lr-fixed{padding-bottom:12px}
/* 목표 만들기 슬라이더: 채워진 만큼 네이비, 나머지 연회색 */
.g-row{display:flex;justify-content:space-between;align-items:baseline}
.g-val{display:flex;align-items:baseline;gap:4px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:8px 0 4px;background:transparent;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--navy) var(--p),#E6E6E6 var(--p))}
.rng::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--navy) var(--p),#E6E6E6 var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.2)}
.rng::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.2)}
.rng:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
/* 실천 항목에서 넘어왔을 때 해야 할 곳을 잠깐 강조 */
.pfocus{outline:2px solid #B5CBFF;outline-offset:4px;animation:pfocus .9s ease-in-out 3}
@keyframes pfocus{50%{outline-color:transparent}}
.view.snap{scroll-snap-type:y mandatory}
.view.snap .lr-row{scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:var(--snapTop,0px)}
.lr-row.on .tx{margin-left:20px}
.lr-row .ca{font-size:12px;color:#999}
.lr-row .nm{font-size:18px;color:#000}
.lr-row .ds{font-size:14px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.lr-row .th,.lr-row .tx{transition:none}}
.bit-card{width:100%;display:flex;align-items:center;gap:14px;padding:24px 20px;text-align:left}
.bit-q{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--f-num);font-size:16px}
/* Fin.do 로고 — 30 × 6 점 그리드 워드마크 (assets/findo-logo.svg를 마스크로 사용) */

function scores() {
  const ans = S.answers.map((a, i) => a == null ? Q[i].s : a);
  const filled = S.answers.filter(a => a == null).length;
  const pv = []; let k = 0, unknown = 0;
  const areas = AREAS.map((ar, ai) => {
    const qs = Q.map((q, i) => ({ q, a:ans[i] })).filter(x => x.q.a === ai);
    const interest = qs.find(x => x.q.t === 'i').a + 1;
    const kq = qs.find(x => x.q.t === 'k'), know = kq.a === UNKNOWN ? 'unknown' : kq.a === kq.q.c ? 'correct' : 'wrong';
    const ps = qs.filter(x => x.q.t === 'p').map(x => x.a + 1), practice = (ps[0] + ps[1]) / 2;
    pv.push(...ps); if (know === 'correct') k++; if (know === 'unknown') unknown++;
    const interp = practice >= 2.5 ? 'good' : interest < 3 ? 'none' : know === 'correct' ? 'gap' : 'learn';
    return { ...ar, interest, practice, know, interp };
  });
  const p = pv.reduce((t, x) => t + x, 0) / pv.length;
  const kHigh = k >= 3, pHigh = p >= 2.5;
  const persona = kHigh ? (pHigh ? 'self' : 'cog') : (pHigh ? 'habit' : 'low');
  // 시작 영역: 지금 열린 영역(소비와 지출 → 저축과 투자 → 세금과 혜택 순) 중 관심 3 이상 · 실천 2.5 미만에서 관심이 가장 높은 곳
  const open = ['spend','save','tax'].map(id => areas.find(a => a.id === id));
  const cand = open.filter(a => a.interest >= 3 && a.practice < 2.5);
  const pool = cand.length ? cand : open;
  const rec = pool.reduce((b, a) => a.interest > b.interest ? a : b, pool[0]);
  return { k, p, k10:k / 5 * 10, p10:p * 2.5, persona, areas, rec, filled, unknown };
}

function meter(used) {
  // 검정 = 지금까지 쓴 돈(끝 = 오늘), 파란 눈금 = 이 속도면 월말에 도달할 지점(예상)
  const n = 64, proj = D().projSpend / S.budget;
  const u = Math.max(1, Math.round(used * n)), pi = Math.min(n - 1, Math.max(u, Math.round(proj * n) - 1));
  let s = ''; for (let i = 0; i < n; i++) s += `<i class="${i === pi ? 'now' : i < u ? '' : 'off'}" style="${i % 8 === 0 || i === n - 1 ? 'width:3px' : ''}"></i>`;
  // 아래 줄: 0 · (검정 끝 아래) 오늘 · 사용% · 예산. 오늘 라벨이 양 끝에 가까우면 끝 라벨을 숨기고 끝에 맞춘다
  const ux = (u - 1) / (n - 1) * 100;
  const at = ux < 12 ? 'left:0' : ux > 88 ? 'right:0' : `left:${ux}%;transform:translateX(-50%)`;
  return `<div class="meter" role="img" aria-label="예산 ${won(S.budget)}원 중 오늘까지 ${pct(used)} 사용, 월말 예상 ${pct(proj)}">
    <div class="bars">${s}</div>
    <div class="lbl t10 mute num">${ux < 12 ? '' : '<span>0</span>'}<span class="tk" style="${at}">오늘 · ${pct(used)}</span>${ux > 88 ? '' : `<span style="margin-left:auto">${won(S.budget)}</span>`}</div>
  </div>`;
}

function radar(sc) {
  const cx = 152, cy = 132, R = 80, n = 5;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 4, cy + Math.sin(ang(i)) * R * v / 4];
  const poly = vals => vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
  const KN = { correct:'지식 ✓', wrong:'지식 ✕', unknown:'지식 ?' };
  const lab = (a, i) => { const [x, y] = pt(i, 4.7), anc = Math.abs(x - cx) < 4 ? 'middle' : x > cx ? 'start' : 'end';
    return `<text x="${x.toFixed(1)}" y="${(y - (i === 0 ? 10 : 2)).toFixed(1)}" text-anchor="${anc}" font-size="11" fill="#181818" opacity="${a.now ? 1 : .45}">${a.name}</text>
      <text x="${x.toFixed(1)}" y="${(y + (i === 0 ? 3 : 11)).toFixed(1)}" text-anchor="${anc}" font-size="9" fill="#606060" opacity="${a.now ? 1 : .6}">${KN[a.know]}${a.now ? '' : ' · 확장 예정'}</text>`; };
  return `<svg viewBox="0 0 305 250" width="100%" role="img" aria-label="5개 영역 레이더: ${sc.areas.map(a => `${a.name} 관심 ${a.interest} 실천 ${a.practice}`).join(', ')}">

    ${[1,2,3,4].map(v => `<polygon points="${poly(Array(n).fill(v))}" fill="none" stroke="#181818" stroke-opacity="${v === 4 ? .18 : .08}"/>`).join('')}
    <polygon points="${poly(Array(n).fill(2.5))}" fill="none" stroke="#181818" stroke-opacity=".35" stroke-dasharray="3 3"/>
    ${sc.areas.map((a, i) => { const [x, y] = pt(i, 4); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#181818" stroke-opacity=".1"/>`; }).join('')}
    ${[1,2,3,4].map(v => `<text x="${cx + 3}" y="${(cy - R * v / 4 + 9).toFixed(1)}" font-size="8" fill="#9C9C9C" font-family="Urbanist">${v}</text>`).join('')}
    <polygon points="${poly(sc.areas.map(a => a.interest))}" fill="url(#rdA)" stroke="#424F62" stroke-opacity=".6" stroke-width="1"/>
    <polygon points="${poly(sc.areas.map(a => a.practice))}" fill="#181818" fill-opacity=".08" stroke="#181818" stroke-width="2" stroke-linejoin="round"/>
    ${sc.areas.map((a, i) => { const [x, y] = pt(i, a.practice); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#181818"/>`; }).join('')}
    ${sc.areas.map(lab).join('')}
  </svg>`;
}

function topSpend() {
  const m = S.period === 'month', all = m ? MONTH_ITEMS : WEEK_ITEMS;
  const items = all.slice().sort((a, b) => b.a - a.a), top = items.slice(0, 4);

  const P = [[112, 130], [232, 74], [236, 196], [46, 226]], FILL = ['#181818', '#B5CBFF', '#DEDEDE', '#D5E3FF'];
  const r = i => 66 * Math.sqrt(i.a / top[0].a);
  const NECKS = [[0, 1], [0, 3], [1, 2]];
  // 두 원을 잇는 잘록한 다리(메타볼 넥)
  const neck = (A, B, ra, rb) => {
    const g = Math.atan2(B[1] - A[1], B[0] - A[0]), sp = .5, nx = -Math.sin(g), ny = Math.cos(g), w = .22 * Math.min(ra, rb);
    const pt = (C, rr, t) => [C[0] + rr * Math.cos(t), C[1] + rr * Math.sin(t)].map(v => v.toFixed(1));
    const a1 = pt(A, ra, g + sp), a2 = pt(A, ra, g - sp), b1 = pt(B, rb, g + Math.PI - sp), b2 = pt(B, rb, g + Math.PI + sp);
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
    return `M${a1} Q${(mx + nx * w).toFixed(1)},${(my + ny * w).toFixed(1)} ${b1} L${b2} Q${(mx - nx * w).toFixed(1)},${(my - ny * w).toFixed(1)} ${a2}Z`;
  };
  const vs = m ? '지난달' : '지난주';
  const si = top.indexOf(sel), sr = r(sel), [sx, sy] = P[si];
  const bt = `${sel.d >= 0 ? '+' : '−'}${won(Math.abs(sel.d))}원 ${vs} 대비`, bw = bt.length * 6.4 + 20;
  const bx = Math.max(0, Math.min(305 - bw, sx - bw / 2)), by = Math.max(0, sy - sr - 16);
  // 그려진 원·배지의 실제 범위에 맞춰 viewBox를 잡아 카드 안에서 가운데 오게
  // 선택이 바뀌어도 그래픽이 움직이지 않도록, 모든 항목의 선택 테두리(+6)와 배지 위치를 다 포함한 고정 범위를 쓴다
  const badge = k => { const it = top[k], t = `${it.d >= 0 ? '+' : '−'}${won(Math.abs(it.d))}원 ${vs} 대비`, w = t.length * 6.4 + 20;

  const B = top.map((_, k) => badge(k));
  const X0 = Math.min(...B.map(b => b[0]), ...top.map((i, k) => P[k][0] - r(i) - 7)), X1 = Math.max(...B.map(b => b[0] + b[2]), ...top.map((i, k) => P[k][0] + r(i) + 7));
  const Y0 = Math.min(...B.map(b => b[1]), ...top.map((i, k) => P[k][1] - r(i) - 7)), Y1 = Math.max(...top.map((i, k) => P[k][1] + r(i) + 7));
  const vb = `${(X0 - 4).toFixed(1)} ${(Y0 - 4).toFixed(1)} ${(X1 - X0 + 8).toFixed(1)} ${(Y1 - Y0 + 8).toFixed(1)}`;
  return `<div class="card c-paper">

/* 중간 목표 길: 아래 왼쪽에서 위 오른쪽으로 오르는 한 줄의 길 위에 단계 점을 찍고, 지금 위치까지 길을 색으로 채운다 */
/* 중간 목표 막대: 단계마다 금액 구간만큼 폭을 나눈 한 줄 막대. 지난 단계 = 검정, 지금 단계 = 채운 만큼 그라데이션, 남은 단계 = 회색 */
function stageBar(saved) {
  const goal = STAGES[STAGES.length - 1].a;
  let cur = STAGES.findIndex(s => saved < s.a); if (cur < 0) cur = STAGES.length - 1;
  const segs = STAGES.map((st, i) => { const from = i ? STAGES[i - 1].a : 0, w = (st.a - from) / goal * 100;
    const fill = Math.max(0, Math.min(1, (saved - from) / (st.a - from)));
    return `<div class="sb-seg" style="flex:${w} 1 0">
      <div class="sb-track ${fill >= 1 ? 'done' : ''}">${fill > 0 && fill < 1 ? `<i style="width:${fill * 100}%"></i>` : ''}</div>
      <div class="sb-amt num">${man(st.a)}</div><div class="sb-name ${i === cur ? 'now' : ''}">${i + 1} ${st.n}</div></div>`; }).join('');
  const nowX = Math.min(100, saved / goal * 100);
  return `<div class="sb" role="img" aria-label="중간 목표 ${STAGES.length}단계 중 ${cur + 1}단계, 지금 ${man(saved)}">
    <div class="sb-now" style="left:${nowX}%"><span>지금 ${man(saved)}</span></div>
    <div class="sb-row">${segs}</div></div>`;
}
function planActual() {
  const L = GOAL_LINE, n = L.months.length, X = i => 40 + i / (n - 1) * 258, Y = v => 150 - v / 5000000 * 130;
  const act = L.actual.map((v, i) => [X(i), Y(v)]);
  const smooth = pts => pts.reduce((d, p, i, a) => { if (!i) return `M${p[0]} ${p[1]}`; const p0 = a[i - 2] || a[i - 1], p1 = a[i - 1], p2 = p, p3 = a[i + 1] || p;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    return d + ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }, '');
  const last = act[act.length - 1], gi = L.actual.length - 1;
  const proj = [last]; let v = S.goalSaved; for (let i = gi + 1; i < n; i++) { v = Math.min(5000000, v + 350000); proj.push([X(i), Y(v)]); }
  const planNow = 5000000 * gi / (n - 1), gap = S.goalSaved - planNow;
  return { gap, svg:`<svg viewBox="0 0 305 176" width="100%" role="img" aria-label="계획 대비 실제 누적 저축. 현재 계획보다 ${won(Math.abs(gap))}원 ${gap < 0 ? '부족' : '앞섬'}">
    <defs><linearGradient id="pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B5CBFF" stop-opacity=".9"/><stop offset="1" stop-color="#B5CBFF" stop-opacity="0"/></linearGradient></defs>
    ${[0,2500000,5000000].map(v => `<line x1="40" x2="298" y1="${Y(v)}" y2="${Y(v)}" stroke="#181818" stroke-opacity=".12" stroke-width=".75"/><text x="34" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="#606060" font-family="Urbanist">${v ? man(v) : 0}</text>`).join('')}
    <path d="${smooth(act)} L${last[0]} 150 L40 150Z" fill="url(#pa)"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n - 1)}" y2="${Y(5000000)}" stroke="#181818" stroke-dasharray="4 4" stroke-width="1"/>
    <path d="${smooth(proj)}" fill="none" stroke="#081F40" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <path d="${smooth(act)}" fill="none" stroke="#181818" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#181818"/><circle cx="${last[0]}" cy="${last[1]}" r="10" fill="none" stroke="#181818" stroke-opacity=".25"/>
    <line x1="${last[0]}" x2="${last[0]}" y1="${Y(planNow)}" y2="${last[1]}" stroke="#181818" stroke-width="1"/>
    ${[0, gi, n - 1].map(i => `<text x="${X(i)}" y="168" font-size="9" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" fill="#606060" font-family="Urbanist">${L.months[i]}</text>`).join('')}
  </svg>` };
}

function renderPanel() {
  const cur = S.mode === 'onboard' ? 'ob' + S.ob : S.sub === 'diag' ? 'diag' : S.sub === 'link' ? 'link' : !S.linked && S.tab === 'home' ? 'empty' : S.tab === 'spend' ? 'spend-' + S.spendView : S.tab === 'plan' ? 'plan-' + S.planView : S.tab === 'learn' ? 'learn-' + S.learnView : S.tab;
  const sc = [ ['ob0','진단 시작'], ['ob1','자기평가'], ['ob2','진단 문항'], ['ob3','진단 결과'], ['diag','내 진단 결과'], ['link','계좌 연동 · 용도 확인'], ['empty','홈 · 연동 전'], ['home','홈'], ['spend-list','지출 · 가계부'], ['spend-analysis','지출 · 분석·영수증'], ['spend-budget','지출 · 예산'], ['plan-bank','저축 · 통장'], ['plan-goal','저축 · 목표'], ['plan-rule','저축 · 자동 규칙'], ['learn-bite','알기 · 한 입 금융'], ['learn-tips','알기 · 팁과 소식'], ['benefit','혜택'] ];
  document.getElementById('navScreens').innerHTML = sc.map(([k, n]) => `<button type="button" class="${cur === k ? 'on' : ''}" data-go="${k}">${n}</button>`).join('');
  document.getElementById('navPersona').innerHTML = Object.entries(PERSONA).map(([k, p]) => `<button type="button" class="${S.persona === k ? 'on' : ''}" data-persona="${k}">${p.name}</button>`).join('');
  document.getElementById('navScen').innerHTML = [ ['pay','결제 발생 → 실시간 피드백'], ['income','외주비 입금 → 배분'], ['settle','더치페이 정산'], ['withdraw','저축 인출 확인'], ['ai','AI 조언 묻기'] ].map(([k, n]) => `<button type="button" data-scen="${k}">${n}</button>`).join('');
}
document.querySelector('.panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; closeSheet(); S.sub = null;
  if (b.dataset.go) { const g = b.dataset.go;
    if (g === 'diag') { S.mode = 'app'; S.sub = 'diag'; }
    else if (g === 'link') { S.mode = 'app'; S.sub = 'link'; }
    else if (g === 'empty') { S.mode = 'app'; S.linked = false; S.tab = 'home'; }
    else if (g.startsWith('ob')) { S.mode = 'onboard'; S.ob = +g[2]; }
    else { S.mode = 'app'; S.linked = true; S.explored.add({ spend:'spend', plan:'save', benefit:'tax' }[g.split('-')[0]]); if (g.startsWith('spend')) { S.tab = 'spend'; S.spendView = g.split('-')[1]; } else if (g.startsWith('plan')) { S.tab = 'plan'; S.planView = g.split('-')[1]; } else if (g.startsWith('learn')) { S.tab = 'learn'; S.learnView = g.split('-')[1]; } else S.tab = g; }
    render(false); }
  if (b.dataset.persona) { S.persona = b.dataset.persona; S.focus = FOCUS_BY_PERSONA[S.persona]; S.explored = new Set(); S.biteOpen = {}; S.planMore = false; S.mode = 'app'; S.tab = 'home'; render(false); }
  const sc = b.dataset.scen;
  if (sc) { S.mode = 'app'; S.linked = true;
    if (sc === 'pay') { S.tab = 'home'; render(false); payment(); }
    if (sc === 'income') { S.tab = 'home'; S.incomeIn = true; S.allocDone = false; render(false); openSheet('alloc'); }
    if (sc === 'settle') { S.tab = 'home'; S.settled = false; render(false); openSheet('settle'); }
    if (sc === 'withdraw') { S.tab = 'plan'; S.planView = 'bank'; render(false); openSheet('withdraw'); }
    if (sc === 'ai') { S.tab = 'spend'; S.spendView = 'budget'; render(false); ask('오늘 얼마 더 써도 돼?'); }
  }
  if (b.id === 'gridBtn') { const g = document.getElementById('gridOv'); g.classList.toggle('on'); b.classList.toggle('on'); }
});

render(false);
</script>

</body></html>
