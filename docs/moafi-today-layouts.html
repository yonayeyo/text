<title>moafi Today Layouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Noto+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 짧은 머리말 → 다섯 배치를 실제 크기 휴대폰으로 나란히. 휴대폰 안은 사진 카드 · 아주 작은 글자 · 무채색만.
   의도적으로 라이트 단일 테마. */
:root{
  color-scheme:light;
  --bg:#EFEFED; --screen:#F6F6F4; --ink:#0F0F10; --ink2:#5E5F64; --ink3:#9B9CA1; --line:#E2E2DF;
  --f-kr:"Noto Sans KR","Apple SD Gothic Neo",-apple-system,sans-serif; --f-lat:"Inter Tight","Noto Sans KR",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-kr);font-size:14px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 96px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:72px}
.head{display:grid;gap:14px;max-width:620px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
h1{font-family:var(--f-lat);font-weight:300;font-size:60px;line-height:.95;letter-spacing:-.045em;margin:0}
.head p{color:var(--ink2);font-size:15px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(390px,100%),1fr));gap:64px 32px;align-items:start}
.demo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0;justify-items:center}
@media (max-width:440px){.grid{grid-template-columns:minmax(0,1fr)}}
.demo-h{width:min(390px,100%);display:flex;align-items:baseline;gap:12px}
.demo-h .k{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.demo-h h2{font-family:var(--f-lat);font-weight:400;font-size:22px;letter-spacing:-.03em;margin:0}
.demo-h span:last-child{margin-left:auto;font-size:12px;color:var(--ink3)}
.demo-d{width:min(390px,100%);font-size:13px;color:var(--ink2)}
.again{font-size:12px;color:var(--ink2);border-bottom:1px solid currentColor;padding-bottom:1px}

/* 휴대폰 */
.phone{width:390px;max-width:100%;height:800px;background:var(--screen);border-radius:52px;position:relative;overflow:hidden;
  box-shadow:0 0 0 1px #D8D8D4,0 0 0 9px #111,0 40px 80px -40px rgba(0,0,0,.35)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 38px;font-family:var(--f-lat);font-size:15px;font-weight:500}
.ph{padding:18px 26px 0;display:flex;justify-content:space-between;align-items:flex-end}
.ph div{display:grid;gap:2px}
.ph small{font-size:12px;color:var(--ink3)}
.ph b{font-size:22px;font-weight:600;letter-spacing:-.03em}
.ph .n{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.stage{position:relative;flex:1;min-height:0;perspective:900px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden}
.stage:active{cursor:grabbing}
.cap{flex:none;padding:0 26px 34px;display:grid;gap:4px}
.cap .no{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.cap .t{font-size:20px;font-weight:600;letter-spacing:-.03em}
.cap .ds{font-size:13px;color:var(--ink2);min-height:21px}
.cap .go{justify-self:start;margin-top:12px;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.cap .go i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.cap .fx{transition:opacity .2s,transform .3s cubic-bezier(.22,1,.36,1)}
.cap.swap .fx{opacity:0;transform:translateY(5px)}

/* 사진 카드 */
.pc{position:absolute;left:50%;top:50%;border-radius:16px;background-size:cover;background-position:center;will-change:transform;
  box-shadow:0 1px 1px rgba(0,0,0,.05),0 22px 32px -24px rgba(0,0,0,.5)}
.pc .ix{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,.9);mix-blend-mode:difference}

#D .pc{width:164px;height:226px;margin:-50px 0 0 -82px;border-radius:16px}
/* E 링 */
#E .hub{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:30%;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;align-content:center;gap:2px;text-align:center}
#E .hub small{font-size:10px;color:var(--ink3)}
#E .hub b{font-family:var(--f-lat);font-weight:400;font-size:20px;letter-spacing:-.03em}
#E .pc{width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:32%}
#E .pc .ix{display:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;border-radius:999px;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.cap .fx{transition:none}}
</style>

<div class="wrap">
  <header class="head">
    <span class="eyebrow">moafi · Home · Today</span>
    <h1>Five ways<br>to hold today.</h1>
    <p>보내 주신 사진 5장으로 카드 7장을 만들고, 처음 보내 주신 배치 레퍼런스 다섯 장을 하나씩 그대로 옮겼어요. 카드 안에는 글자를 넣지 않았고, 화면 아래 같은 자리에 지금 고른 할 일 하나만 보여요. 끌거나 넘겨 보고, 고른 카드를 한 번 더 누르면 실행돼요.</p>
  </header>
  <section class="grid" id="grid"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ITEMS = [
  ['줄이기 제안 담기', '지난달 지출에서 아낄 방법을 골라 다음 달 예산에 넣어요'],
  ['매달 나가는 돈', '자동으로 찾은 고정 지출 4건이 맞는지 확인해요'],
  ['외주비 나누기', '들어온 320,000원을 목표 · 비상금 · 자유롭게로 나눠요'],
  ['연말정산 카드 확인', '남은 기간 어느 카드가 공제에 유리한지 봐요'],
  ['배달 한도 알림', '배달 결제 전에 남은 한도를 알려 줘요'],
  ['영수증 출력', '9월 지출을 영수증 한 장으로 받아 봐요'],
  ['무지출 데이', '오늘 한 푼도 안 썼다면 인증해요'],
];
const N = ITEMS.length, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, pad = n => String(n).padStart(2, '0');
const DEMOS = [
  { id:'A', name:'Curved wall', kr:'휘어진 벽', ref:'레퍼런스 2', d:'오목한 벽에 카드가 둥글게 걸려 있어요. 가운데가 가장 멀고 양옆은 다가오며 안쪽을 봐요. 좌우로 끌어 돌려요.' },
  { id:'B', name:'Spine', kr:'책 등뼈', ref:'레퍼런스 1', d:'비스듬한 등뼈 하나에 카드가 책장처럼 묶여 있어요. 왼쪽으로 넘기면 한 장씩 넘어가고, 오른쪽 맨 앞 장이 지금 할 일이에요.' },
  { id:'C', name:'Spread', kr:'두께 있는 펼침', ref:'레퍼런스 3', d:'가운데 카드가 정면을 보고, 양옆 카드는 바깥으로 돌아가며 검은 옆면(두께)이 드러나요.' },
  { id:'D', name:'Fanned row', kr:'기울어진 줄', ref:'레퍼런스 4', d:'큰 제목 위로 카드들이 서로 다른 각도로 겹쳐 놓여요. 고른 카드는 똑바로 서며 위로 올라와요.' },
  { id:'E', name:'Ring', kr:'링', ref:'레퍼런스 5', d:'가운데 ‘오늘 쓸 수 있는 돈’을 둘러싼 링이에요. 돌리면 맨 위에 온 카드가 지금 할 일이 돼요.' },
];
document.getElementById('grid').innerHTML = DEMOS.map(m => `<article class="demo">
  <div class="demo-h"><span class="k">${m.id}</span><h2>${m.name}</h2><span>${m.kr} · ${m.ref}</span></div>
  <div class="phone"><div class="scr">
    <div class="sb"><span>9:41</span><span style="font-size:12px">●●● ▮</span></div>
    <div class="ph"><div><small>10월 15일 수요일</small><b>오늘 할 일</b></div><span class="n" data-cnt>01 / 07</span></div>
    <div class="stage" id="${m.id}" tabindex="0" role="listbox" aria-label="${m.kr} · 오늘 할 일 7개"></div>
    <div class="cap"><span class="no fx" data-no></span><span class="t fx" data-t></span><p class="ds fx" data-ds></p>
      <button class="go" type="button" data-go>시작하기<i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button></div>
  </div></div>
  <p class="demo-d">${m.d}</p><button class="again" type="button" data-again="${m.id}">등장 다시 보기</button></article>`).join('');

let tt; const run = i => { const t = document.getElementById('toast'); t.textContent = `‘${ITEMS[i][0]}’ 화면으로 이동해요 (시안)`; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); };
const card = (i, cls = '') => `<div class="pc im${i} ${cls}" data-i="${i}" role="option" aria-label="${pad(i + 1)} ${ITEMS[i][0]}"><span class="ix">${pad(i + 1)}</span></div>`;
const ease = t => 1 - Math.pow(1 - t, 4);
const wrapD = d => { d = ((d % N) + N) % N; return d > N / 2 ? d - N : d; };

/* 공통 엔진: pos(실수) · 끌기 관성 · 가장 가까운 카드에 멈춤 · 캡션 */
function demo(id, cfg) {
  const st = document.getElementById(id), phone = st.closest('.scr'), cap = phone.querySelector('.cap');
  st.innerHTML = cfg.html();
  const cards = [...st.querySelectorAll(cfg.sel || '.pc')];
  const S = { pos:0, spread:1, sel:-1 }; let anim = 0;
  const clampPos = p => cfg.loop ? p : Math.max(0, Math.min(N - 1, p));
  const selOf = () => cfg.loop ? ((Math.round(S.pos) % N) + N) % N : Math.max(0, Math.min(N - 1, Math.round(S.pos)));
  function draw() {
    cards.forEach((c, k) => { const i = +c.dataset.i, d = cfg.loop ? wrapD(i - S.pos) : i - S.pos; cfg.draw(c, d, i, S); });
    const s = selOf(); if (s !== S.sel) { S.sel = s; caption(s); }
  }
  function caption(i) {
    phone.querySelector('[data-cnt]').textContent = `${pad(i + 1)} / ${pad(N)}`;
    cap.classList.add('swap'); clearTimeout(caption.t);
    caption.t = setTimeout(() => { cap.querySelector('[data-no]').textContent = pad(i + 1); cap.querySelector('[data-t]').textContent = ITEMS[i][0]; cap.querySelector('[data-ds]').textContent = ITEMS[i][1]; cap.classList.remove('swap'); }, reduce ? 0 : 130);
  }
  function tween(to, dur, spreadTo) { cancelAnimationFrame(anim); const p0 = S.pos, s0 = S.spread, s1 = spreadTo ?? S.spread;
    if (reduce || dur <= 0) { S.pos = to; S.spread = s1; draw(); return; }
    const t0 = performance.now(); const step = now => { const k = Math.min(1, (now - t0) / dur), e = ease(k); S.pos = p0 + (to - p0) * e; S.spread = s0 + (s1 - s0) * e; draw(); if (k < 1) anim = requestAnimationFrame(step); }; anim = requestAnimationFrame(step); }
  const goTo = i => { let t = i; if (cfg.loop) { while (t - S.pos > N / 2) t -= N; while (S.pos - t > N / 2) t += N; } else t = clampPos(t); tween(t, 520 + Math.abs(t - S.pos) * 110); };
  let dr = null;
  st.addEventListener('pointerdown', e => { cancelAnimationFrame(anim); dr = { x:e.clientX, p0:S.pos, moved:false, id:e.pointerId, card:e.target.closest('[data-i]'), h:[[performance.now(), e.clientX]] }; });
  st.addEventListener('pointermove', e => { if (!dr) return; const dx = e.clientX - dr.x;
    if (!dr.moved && Math.abs(dx) > 5) { dr.moved = true; st.setPointerCapture(dr.id); }
    if (!dr.moved) return; let p = dr.p0 - dx / cfg.px;
    if (!cfg.loop) { if (p < 0) p *= .3; if (p > N - 1) p = N - 1 + (p - N + 1) * .3; }
    S.pos = p; draw(); dr.h.push([performance.now(), e.clientX]); if (dr.h.length > 6) dr.h.shift(); });
  const up = () => { if (!dr) return; const d = dr; dr = null;
    if (!d.moved) { if (d.card) { const i = +d.card.dataset.i; if (i === S.sel && Math.abs(wrapD(S.pos - S.sel)) < .3) run(i); else goTo(i); } return; }
    const [t0, x0] = d.h[0], [t1, x1] = d.h[d.h.length - 1], v = (x1 - x0) / Math.max(16, t1 - t0);
    const target = Math.round(clampPos(S.pos + Math.max(-2, Math.min(2, -v * 150 / cfg.px))));
    tween(target, 620 + Math.min(500, Math.abs(target - S.pos) * 120)); };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  st.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); goTo(S.sel + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(S.sel - 1); } if (e.key === 'Enter') run(S.sel); });
  phone.querySelector('[data-go]').addEventListener('click', () => run(S.sel));
  const intro = () => { cancelAnimationFrame(anim); const [p, s, dur] = cfg.from; S.pos = p; S.spread = s; draw(); tween(0, dur, 1); };
  document.querySelector(`[data-again="${id}"]`).addEventListener('click', intro);
  S.pos = 0; draw();
  return intro;
}

/* A. 휘어진 벽 (레퍼런스 2): 오목 원통 안쪽 */
const introA = demo('A', { px:96, loop:true, from:[N, 1, 1900],
  html:() => ITEMS.map((_, i) => card(i)).join(''),
  draw:(c, d) => { const th = d * 27, r = th * Math.PI / 180, R = 240, far = Math.abs(d);
    c.style.transform = `translate3d(${(R * Math.sin(r)).toFixed(1)}px,${(-8).toFixed(0)}px,${(R * .62 * (1 - Math.cos(r)) - 10).toFixed(1)}px) rotateY(${th.toFixed(1)}deg)`;
    c.style.opacity = far > 3.4 ? 0 : 1; c.style.zIndex = 100 - Math.round(far * 10);
    c.style.filter = `brightness(${(1 - Math.min(.16, far * .05)).toFixed(3)})`; } });

/* B. 책 등뼈 (레퍼런스 1): 오른쪽 = 남은 장, 왼쪽 = 넘긴 장 */
const introB = demo('B', { px:70, sel:'.pg', from:[N - 1, 1, 1900],
  html:() => `<div class="book"><span class="spine"></span>${ITEMS.map((_, i) => `<div class="pg" data-i="${i}">${card(i).replace('data-i', 'data-x')}${card(i, 'bk').replace('data-i', 'data-x')}</div>`).join('')}</div>`,
  draw:(pg, d) => { let a;
    // 오른쪽 묶음은 화면 안쪽으로 차례로 물러나고, 맨 앞 장(지금 할 일)이 가장 평평하다
    if (d >= 0) a = 14 + Math.min(d, 5.2) * 13.5;
    else if (d > -1) a = 14 - d * 152;                        // 넘어가는 중
    else a = 166 - Math.min(-d - 1, 5.2) * 13.5;              // 왼쪽 묶음(넘긴 장)
    pg.style.transform = `rotateY(${a.toFixed(1)}deg)`; pg.style.zIndex = 100 - Math.round(Math.abs(d + (d < 0 ? .5 : 0)) * 10); } });

/* C. 두께 있는 펼침 (레퍼런스 3): 볼록 커버플로 + 검은 옆면 */
const introC = demo('C', { px:100, loop:true, from:[N, 1, 1700],
  html:() => ITEMS.map((_, i) => card(i)).join(''),
  draw:(c, d) => { const a = Math.min(1, Math.abs(d)), sg = Math.sign(d), rest = Math.max(0, Math.abs(d) - 1);
    const x = sg * (a * 118 + rest * 42), z = -a * 80 - rest * 36, ry = -sg * a * 62;
    c.style.transform = `translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${ry.toFixed(1)}deg)`;
    c.style.zIndex = 100 - Math.round(Math.abs(d) * 10); c.style.opacity = Math.abs(d) > 3.6 ? 0 : 1; } });

/* D. 기울어진 줄 (레퍼런스 4): 큰 제목 위로 서로 다른 각도의 카드 */
const TILT = [-9, 7, -4, 11, -7, 5, -11];
const introD = demo('D', { px:90, loop:true, from:[-N, 1, 1700],
  html:() => `<div class="ttl">Today<small>오늘 할 일 7개</small></div>` + ITEMS.map((_, i) => card(i)).join(''),
  draw:(c, d, i) => { const far = Math.abs(d), on = Math.max(0, 1 - far);
    const x = d * 90, y = 40 + far * 10 - on * 24, rz = TILT[i] * (1 - on), ry = -d * 9;
    c.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${(on * 40 - far * 16).toFixed(1)}px) rotateZ(${rz.toFixed(1)}deg) rotateY(${ry.toFixed(1)}deg) scale(${(1 + on * .06).toFixed(3)})`;
    c.style.zIndex = 100 - Math.round(far * 10); c.style.opacity = far > 3.4 ? 0 : 1; } });

/* E. 링 (레퍼런스 5): 가운데 숫자를 둘러싼 고리, 맨 위 = 지금 할 일 */
const introE = demo('E', { px:58, loop:true, from:[-N, 0, 1900],
  html:() => `<div class="hub"><small>오늘 쓸 수 있는 돈</small><b>26,500</b><small>원</small></div>` + ITEMS.map((_, i) => card(i)).join(''),
  draw:(c, d, i, S) => { const ang = d * 360 / N - 90, r = ang * Math.PI / 180, R = 142 * S.spread, on = Math.max(0, 1 - Math.abs(d));
    const x = R * Math.cos(r), y = R * Math.sin(r);
    c.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) rotate(${((ang + 90) * .55 + (1 - S.spread) * 180).toFixed(1)}deg) scale(${(.92 + on * .2) * (.3 + .7 * S.spread)})`;
    c.style.zIndex = 10 + Math.round(on * 10); c.style.opacity = .2 + .8 * S.spread; } });

// 화면에 들어오면 한 번씩 등장
const INTROS = { A:introA, B:introB, C:introC, D:introD, E:introE };
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { INTROS[e.target.id](); io.unobserve(e.target); } }), { threshold:.4 });
Object.keys(INTROS).forEach(k => io.observe(document.getElementById(k)));
</script>
