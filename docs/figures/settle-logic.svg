<rect width="100%" height="100%" fill="#fff"/><text x="40" y="52" font-size="24" font-weight="700" fill="#15181C">moafi 더치페이 정산 로직</text><text x="40" y="80" font-size="15" fill="#6B6F75">캘린더 일정과 결제 시간을 대조해 정산 후보를 찾고, 송금은 앱 밖에서 이루어진다</text><line x1="40" x2="1060" y1="105" y2="105" stroke="#D6D9DD" stroke-width="1"/><text x="40" y="135" font-size="15" font-weight="700" fill="#15181C">1  감지</text><line x1="40" x2="1060" y1="845" y2="845" stroke="#D6D9DD" stroke-width="1"/><text x="40" y="875" font-size="15" font-weight="700" fill="#15181C">2  확인 · 공유</text><line x1="40" x2="1060" y1="1390" y2="1390" stroke="#D6D9DD" stroke-width="1"/><text x="40" y="1420" font-size="15" font-weight="700" fill="#15181C">3  입금 확인 · 완료</text><rect x="385.0" y="143.0" width="330" height="64" rx="12" fill="#fff" stroke="#3A3D42" stroke-width="1.5"/><text x="550" y="169.9" font-size="17" font-weight="600" fill="#15181C" text-anchor="middle">결제 발생</text><text x="550" y="191.9" font-size="14" font-weight="400" fill="#6B6F75" text-anchor="middle">연동된 카드 · 계좌</text><rect x="60.0" y="143.0" width="230" height="64" rx="12" fill="#fff" stroke="#6B6F75" stroke-width="1.5" stroke-dasharray="6 5"/><text x="175" y="169.9" font-size="17" font-weight="600" fill="#15181C" text-anchor="middle">금융기관</text><text x="175" y="191.9" font-size="14" font-weight="400" fill="#6B6F75" text-anchor="middle">마이데이터 연동</text><path d="M290,175 L385,175" fill="none" stroke="#3A3D42" stroke-width="1.5"  marker-end="url(#ar)"/><polygon points="550,245.0 665.0,295 550,345.0 435.0,295" fill="#fff" stroke="#3A3D42" stroke-width="1.5"/><text x="550" y="290.0" font-size="16" font-weight="600" fill="#15181C" text-anchor="middle">캘린더</text><text x="550" y="311.0" font-size="16" font-weight="600" fill="#15181C" text-anchor="middle">연동?</text><path d="M550,207 L550,245" fill="none" stroke="#3A3D42" stroke-width="1.5"  marker-end="url(#ar)"/><rect x="360.0" y="393.0" width="380" height="64" rx="12" fill="#fff" stroke="#3A3D42" stroke-