<style>

.dk{background:#FAFAFA;color:#0D0D0D}

.cd{border-radius:32px;padding:22px;position:relative}
.cd{border-radius:40px}
.cd,.step,.st,.tm,.opt,.fld,.term,.bf,.alloc div,.lt,[style*="border-radius:2"],[style*="border-radius:3"],[style*="border-radius:4"]{corner-shape:squircle}
.gb{background:radial-gradient(120% 115% at 28% 40%,#A9CFFF 0%,#C8E1FF 40%,#E2EEFF 76%,#F5F9FF 100%);box-shadow:inset 0 0 20px 6px rgba(255,255,255,.92),inset 0 0 64px 8px rgba(255,255,255,.4);color:#0D0D0D}

.top{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 0}

      <rect x="0" y="12" width="318" height="28" rx="14" fill="#FFFFFF"></rect>

      </g>
    </svg>
    <div class="row sb xs mu" style="margin-top:8px"><span>처음 들어요</span><span>설명할 수 있어요</span></div>
  </section>

  <section class="cd cg" style="margin:10px 16px 0;padding:22px 20px" aria-label="실천 수준 자기평가">
    <div class="row sb"><h2 style="font-size:17px;font-weight:400">실천 수준</h2><span class="ib cl" style="width:36px;height:36px;font-size:16px">3</span></div>
    <p class="xs mu" style="margin-top:4px">예산 관리와 저축을 실제로 꾸준히 하고 있나요?</p>
    <svg width="318" height="52" viewBox="0 0 318 52" style="display:block;margin-top:18px" role="slider" aria-label="실천 수준 점수" aria-valuemin="1" aria-valuemax="10" aria-valuenow="3" tabindex="0">
      <rect x="0" y="12" width="318" height="28" rx="14" fill="#FFFFFF"></rect>
      <g filter="url(#gooSelf)" fill="url(#slideG)">
        <rect x="0" y="12" width="80" height="28" rx="14"></rect>
        <circle cx="80" cy="26" r="24"></circle>

        <text x="80" y="32" fill="#0D0D0D" font-size="18" font-weight="300">3</text>

      </g>

    <div class="row sb xs mu" style="margin-top:8px"><span>거의 안 해요</span><span>꾸준히 해요</span></div>
  </section>

  <div style="position:absolute;left:16px;right:16px;bottom:34px">
