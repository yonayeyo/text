<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>목표</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#0D0D0D}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.dk{background:#0D0D0D;color:#fff}
.lt{background:#EBEBE9;color:#0D0D0D}
.eng{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.t1{font-size:34px;font-weight:300;line-height:1.16;letter-spacing:-.035em}
.t2{font-size:22px;font-weight:300;line-height:1.28;letter-spacing:-.03em}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.cur{font-size:.42em;letter-spacing:0;margin-left:.2em;font-weight:400}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cd{border-radius:32px;padding:22px;position:relative}
.cl{background:#D9F84A;color:#0D0D0D}
.cw{background:#FFFFFF;color:#0D0D0D}
.cg{background:#EBEBE9;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.cv{background:#A68BF5;color:#0D0D0D}
.cp{background:#EEF9B8;color:#0D0D0D}
.pl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;border:0;white-space:nowrap;text-decoration:none}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.gl{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);color:#fff}
.glw{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8)}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.notch{-webkit-mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px);mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px)}
.nb{position:absolute;right:2px;bottom:2px;width:56px;height:56px}
.nav{position:absolute;left:20px;right:20px;bottom:28px;height:68px;border-radius:999px;background:rgba(13,13,13,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:5}
.nav a{height:52px;min-width:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;text-decoration:none;font-size:14px;font-weight:500}
.nav a.on{background:#D9F84A;color:#0D0D0D;padding:0 20px 0 16px}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 0}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:4px;border-radius:22px;padding:12px 18px;flex:1}
.fld label{font-size:11px;opacity:.6}
.fld input{border:0;background:transparent;font:inherit;font-size:18px;font-weight:300;letter-spacing:-.03em;padding:0;outline:none;width:100%;color:inherit}
</style>
</helmet>
<div class="ph lt" style="height:1560px">

  <div class="top">
    <div class="row" style="gap:8px">
      <button class="pl cb" style="height:36px">전세 자금</button>
      <button class="pl cw" style="height:36px">도쿄 여행</button>
      <button class="ib cw" style="width:36px;height:36px" aria-label="새 목표 추가"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <button class="ib cw" style="width:44px;height:44px" aria-label="목표 편집"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
  </div>

  <section aria-label="전세 자금 목표 요약" style="padding:26px 20px 0">
    <p class="eng">Goal · 2028.09</p>
    <h1 class="t1" style="margin-top:10px">전세 자금<br>3천만 원 모으기</h1>
    <div class="row" style="gap:10px;margin-top:18px;align-items:baseline">
      <p class="n" style="font-size:40px;line-height:1">11,460,000<span class="cur">₩</span></p>
      <span class="tg cl">38.2%</span>
    </div>
  </section>

  <section aria-label="단계별 중간 목표" class="cd cw" style="margin:20px 16px 0;padding:22px 20px">
    <div class="row sb"><p class="eng">Milestones</p><span class="xs mu">5단계 중 3단계</span></div>
    <svg width="318" height="318" viewBox="0 0 318 318" style="display:block;margin-top:10px" role="img" aria-label="1단계 5,000,000원과 2단계 10,000,000원 완료, 3단계 15,000,000원 진행 중 76%, 4단계 22,000,000원, 5단계 30,000,000원 예정">
      <path d="M44 288 C150 292 268 278 254 226 C240 176 58 210 78 158" fill="none" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round"></path>
      <path d="M78 158 C98 106 270 140 252 92 C236 50 140 64 128 36" fill="none" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"></path>
      <circle cx="44" cy="288" r="18" fill="#0D0D0D"></circle>
      <path d="M37 288.5l5 5 9-10" fill="none" stroke="#D9F84A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="254" cy="226" r="18" fill="#0D0D0D"></circle>
      <path d="M247 226.5l5 5 9-10" fill="none" stroke="#D9F84A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="78" cy="158" r="34" fill="#D9F84A"></circle>
      <circle cx="78" cy="158" r="26" fill="none" stroke="#0D0D0D" stroke-opacity=".15" stroke-width="5"></circle>
      <circle cx="78" cy="158" r="26" fill="none" stroke="#0D0D0D" stroke-width="5" stroke-linecap="round" stroke-dasharray="124 163.4" transform="rotate(-90 78 158)"></circle>
      <text x="78" y="163" text-anchor="middle" font-family="Archivo, sans-serif" font-size="14" fill="#0D0D0D">76%</text>
      <circle cx="252" cy="92" r="18" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 3"></circle>
      <circle cx="128" cy="36" r="22" fill="#A68BF5"></circle>
      <path d="M121 46V26h12l-2 4 2 4h-12" fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <g font-family="Archivo, Noto Sans KR, sans-serif" fill="#0D0D0D">
        <text x="72" y="284" font-size="13">5,000,000 ₩</text><text x="72" y="300" font-size="10" fill-opacity=".5">2025.12 완료</text>
        <text x="226" y="222" font-size="13" text-anchor="end">10,000,000 ₩</text><text x="226" y="238" font-size="10" text-anchor="end" fill-opacity=".5">2026.07 완료</text>
        <text x="122" y="152" font-size="15">15,000,000 ₩</text><text x="122" y="170" font-size="11">3,540,000 ₩ 남음</text>
        <text x="226" y="88" font-size="13" text-anchor="end">22,000,000 ₩</text><text x="226" y="104" font-size="10" text-anchor="end" fill-opacity=".5">2027.08 예상</text>
        <text x="160" y="32" font-size="13">30,000,000 ₩</text><text x="160" y="48" font-size="10" fill-opacity=".5">2028.09 목표</text>
      </g>
    </svg>
    <div class="row" style="gap:8px;margin-top:6px">
      <div class="cl" style="flex:1;border-radius:22px;padding:12px 16px"><p class="xs">지금 단계</p><p class="sm" style="margin-top:2px">3 · 2027년 1월까지</p></div>
      <div class="cg" style="flex:1;border-radius:22px;padding:12px 16px"><p class="xs mu">다음 단계</p><p class="sm" style="margin-top:2px">4 · 월 저축 유지</p></div>
    </div>
  </section>

  <section aria-label="계획 대비 실제" class="cd cb" style="margin:12px 16px 0;padding:22px 20px">
    <div class="row sb"><p class="eng" style="color:#D9F84A">Plan vs real</p><span class="tg cv">완료 2개월 늦어짐</span></div>
    <svg width="318" height="200" viewBox="0 0 318 200" style="display:block;margin-top:16px" role="img" aria-label="계획선은 2028년 9월 3천만 원 도달, 실제 누적 저축은 계획보다 340,000원 적어 2028년 11월 도달 예상">
      <line x1="0" y1="170" x2="318" y2="170" stroke="#FFFFFF" stroke-opacity=".2"></line>
      <line x1="0" y1="10" x2="318" y2="10" stroke="#FFFFFF" stroke-opacity=".1" stroke-dasharray="2 4"></line>
      <path d="M0 167.3 L15.5 159.9 L31 152.9 L46.6 145.5 L62.1 137.5 L69.8 140.1 L85.4 129.5 L100.9 118.8 L116.4 108.9 L116.4 170 L0 170 Z" fill="#D9F84A" fill-opacity=".18"></path>
      <line x1="0" y1="170" x2="302.6" y2="10" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity=".7"></line>
      <path d="M0 167.3 L15.5 159.9 L31 152.9 L46.6 145.5 L62.1 137.5 L69.8 140.1 L85.4 129.5 L100.9 118.8 L116.4 108.9" fill="none" stroke="#D9F84A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M116.4 108.9 L318 10" fill="none" stroke="#D9F84A" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"></path>
      <circle cx="69.8" cy="140.1" r="4" fill="#A68BF5"></circle>
      <circle cx="116.4" cy="108.9" r="6" fill="#D9F84A" stroke="#0D0D0D" stroke-width="2"></circle>
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" fill="#FFFFFF">
        <text x="0" y="190" fill-opacity=".5">25.07</text>
        <text x="116" y="190" text-anchor="middle">지금</text>
        <text x="296" y="190" text-anchor="end" fill-opacity=".5">28.09</text>
        <text x="126" y="132">−340,000 ₩</text>
        <text x="58" y="158" fill="#A68BF5">인출</text>
        <text x="236" y="30" text-anchor="end" fill-opacity=".7">계획</text>
      </g>
    </svg>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
      <div class="gl" style="border-radius:22px;padding:12px 16px"><p class="xs mu">10월 저축</p><p class="n" style="font-size:17px;margin-top:2px">계획대로</p></div>
      <div class="gl" style="border-radius:22px;padding:12px 16px"><p class="xs mu">9월 지출</p><p class="n" style="font-size:17px;margin-top:2px">+118,000 ₩</p></div>
    </div>
  </section>

  <section aria-label="목표 설정" class="cd cw" style="margin:12px 16px 0;padding:22px 20px">
    <p class="eng">Setting</p>
    <div class="row" style="gap:6px;margin-top:14px;flex-wrap:wrap" role="group" aria-label="목표 유형">
      <button class="pl cl" style="height:34px;font-size:12px" aria-pressed="true">전세 자금</button>
      <button class="pl cg" style="height:34px;font-size:12px">독립</button>
      <button class="pl cg" style="height:34px;font-size:12px">여행</button>
      <button class="pl cg" style="height:34px;font-size:12px">비상금</button>
      <button class="pl cg" style="height:34px;font-size:12px">직접 입력</button>
    </div>
    <div class="row" style="gap:8px;margin-top:10px">
      <div class="fld cg"><label for="g-amt">목표 금액</label><input id="g-amt" type="text" value="30,000,000 ₩"></div>
      <div class="fld cg" style="flex:.7"><label for="g-end">기간</label><input id="g-end" type="text" value="39개월"></div>
    </div>
    <div class="row sb" style="margin-top:14px;font-size:12px">
      <span class="mu">필요한 월 저축</span><span class="n" style="font-size:15px">770,000 ₩</span>
    </div>
  </section>

  <nav class="nav" aria-label="주요 메뉴">
    <a href="Main.dc.html" aria-label="홈"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></a>
    <a href="Spend.dc.html" aria-label="지출"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg></a>
    <a href="Plan.dc.html" aria-label="플랜"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    <a href="Goal.dc.html" class="on" aria-current="page"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg><span>목표</span></a>
    <a href="Challenge.dc.html" aria-label="챌린지"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg></a>
  </nav>
</div>
