<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비정기 수입 배분</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FAFAFA}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.lt{background:#EBEBE9;color:#0D0D0D}
.eng{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.t1{font-size:34px;font-weight:300;line-height:1.16;letter-spacing:-.035em}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cl{background:#C8E1FF;color:#0D0D0D}
.cw{background:#FFFFFF;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.pl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;border:0;white-space:nowrap;text-decoration:none}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 0}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.cd{border-radius:40px}
.cd,.step,.st,.tm,.opt,.fld,.term,.bf,.alloc div,.lt,[style*="border-radius:2"],[style*="border-radius:3"],[style*="border-radius:4"]{corner-shape:squircle}
.gb{background:radial-gradient(120% 115% at 28% 40%,#A9CFFF 0%,#C8E1FF 40%,#E2EEFF 76%,#F5F9FF 100%);box-shadow:inset 0 0 20px 6px rgba(255,255,255,.92),inset 0 0 64px 8px rgba(255,255,255,.4);color:#0D0D0D}
.gp{background:radial-gradient(120% 115% at 28% 40%,#FF6890 0%,#FF86A8 40%,#FFBACD 80%,#FFDDE6 100%);box-shadow:inset 0 0 20px 6px rgba(255,255,255,.85),inset 0 0 64px 8px rgba(255,255,255,.3);color:#0D0D0D}
.gm{background:radial-gradient(90% 120% at 18% 30%,#FF7FA3 0%,rgba(255,127,163,0) 62%),radial-gradient(90% 120% at 90% 85%,#B9D8FF 0%,rgba(185,216,255,0) 70%),#E9C6E6;box-shadow:inset 0 0 20px 6px rgba(255,255,255,.88),inset 0 0 64px 8px rgba(255,255,255,.35);color:#0D0D0D}
</style>

<div class="ph lt" style="height:844px">

    <span class="tg cb">10.17 14:02 입금</span>

    <p class="eng">Extra income</p>

  </section>

  <section aria-label="배분 제안" class="cd cw" style="margin:18px 16px 0;padding:22px 20px 20px">
    <div class="row sb"><p class="eng">Split</p><span class="xs mu">목표 50 · 비상금 30 · 자유 20</span></div>
    <svg width="318" height="372" viewBox="0 0 318 372" style="display:block;margin-top:16px" role="img" aria-label="380,000원을 전세 자금 190,000원, 비상금 114,000원, 자유 76,000원으로 나누는 제안">
      <defs>
        <linearGradient id="rbB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF5FF"></stop><stop offset="1" stop-color="#8EBFFF"></stop></linearGradient>
        <linearGradient id="rbP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEEF2"></stop><stop offset="1" stop-color="#FF85A7"></stop></linearGradient>
        <linearGradient id="rbG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F2"></stop><stop offset="1" stop-color="#BDBDBA"></stop></linearGradient>
      </defs>
      <line x1="69" y1="10" x2="249" y2="10" stroke="#0D0D0D" stroke-width="1"></line>
      <g fill="#0D0D0D"><circle cx="69" cy="10" r="3"></circle><circle cx="159" cy="10" r="3"></circle><circle cx="213" cy="10" r="3"></circle><circle cx="249" cy="10" r="3"></circle></g>
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" fill="#0D0D0D" fill-opacity=".5" text-anchor="middle"><text x="114" y="27">50%</text><text x="186" y="27">30%</text><text x="231" y="27">20%</text></g>
      <rect x="49" y="38" width="220" height="34" rx="17" fill="#0D0D0D"></rect>
      <text x="159" y="60" text-anchor="middle" font-family="Archivo, Noto Sans KR, sans-serif" font-size="15" font-weight="300" fill="#FFFFFF">380,000 ₩</text>
      <path d="M69 72 C69 154.0 0 154.0 0 236 L90 236 C90 154.0 159 154.0 159 72 Z" fill="url(#rbB)"></path>
      <path d="M161 72 C161 154.0 132 154.0 132 236 L184 236 C184 154.0 213 154.0 213 72 Z" fill="url(#rbP)"></path>
      <path d="M215 72 C215 154.0 284 154.0 284 236 L318 236 C318 154.0 249 154.0 249 72 Z" fill="url(#rbG)"></path>
      <rect x="0" y="236" width="90" height="10" rx="5" fill="#6AA8F5"></rect>
      <rect x="132" y="236" width="52" height="10" rx="5" fill="#FF5C88"></rect>
      <rect x="284" y="236" width="34" height="10" rx="5" fill="#8A8A88"></rect>
      <g fill="#0D0D0D"><circle cx="4" cy="270" r="3"></circle><circle cx="136" cy="270" r="3"></circle><circle cx="314" cy="270" r="3"></circle></g>
      <g font-family="Archivo, Noto Sans KR, sans-serif" fill="#0D0D0D">
        <text x="12" y="274" font-size="12">전세 자금</text>
        <text x="0" y="300" font-size="20" font-weight="300" letter-spacing="-.8">190,000 ₩</text>
        <text x="0" y="320" font-size="11" fill-opacity=".55">진행률 38.2 → 38.8%</text>
        <text x="144" y="274" font-size="12">비상금</text>
        <text x="132" y="300" font-size="16" font-weight="300">114,000</text>
        <text x="132" y="320" font-size="11" fill-opacity=".55">1.20M → 1.31M</text>
        <text x="306" y="274" font-size="12" text-anchor="end">자유</text>
        <text x="318" y="300" font-size="14" font-weight="300" text-anchor="end">76,000</text>
        <text x="318" y="320" font-size="11" fill-opacity=".55" text-anchor="end">생활비로</text>
      </g>
      <line x1="0" y1="340" x2="318" y2="340" stroke="#0D0D0D" stroke-opacity=".12"></line>
      <text x="0" y="362" font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" fill="#0D0D0D" fill-opacity=".55">비상금이 1,800,000 ₩에 닿으면 그 몫은 목표로 보내요</text>
    </svg>
  </section>


  <div style="position:absolute;left:16px;right:16px;bottom:34px">
    <div class="row" style="gap:8px">
      <button class="bt cw" style="flex:1">비율 수정</button>
      <button class="bt cl" style="flex:1.7">이대로 나누기</button>
    </div>
  </div>
</div>
