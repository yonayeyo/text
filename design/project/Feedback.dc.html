<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실시간 피드백</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FAFAFA}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.dk{background:#FAFAFA;color:#0D0D0D}
.eng{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.cur{font-size:.42em;letter-spacing:0;margin-left:.2em;font-weight:400}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cl{background:#C8E1FF;color:#0D0D0D}
.cw{background:#FFFFFF;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.cv{background:#FF769C;color:#0D0D0D}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.chip{flex:1;border-radius:26px;padding:16px 18px;corner-shape:squircle}
</style>
</helmet>
<div class="ph dk" style="height:844px">

  <div class="row sb" style="padding:56px 20px 0">
    <button class="ib cw" style="width:44px;height:44px" aria-label="닫기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span class="tg cv">초과 위험</span>
  </div>

  <section role="dialog" aria-label="방금 결제한 지출 피드백" style="padding:24px 20px 0">
    <div class="row" style="gap:10px">
      <span class="ib cw" style="width:36px;height:36px"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h12v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M9 3v3M13 3v3"></path></svg></span>
      <p class="sm">카페 · 체크카드 <span class="mu">· 방금 · 이번 달 23번째</span></p>
    </div>
    <p class="n" style="font-size:56px;line-height:1;margin-top:16px">−12,800<span class="cur">₩</span></p>

    <svg width="350" height="300" viewBox="0 0 350 300" style="display:block;margin-top:18px" role="img" aria-label="한 달 예산 1,200,000원 중 444,600원, 37% 남음. 오늘 기준 적정치는 45%. 방금 12,800원 결제">
      <defs>
        <radialGradient id="leftOrb" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#7DB6FF"></stop><stop offset=".55" stop-color="#B5D6FF"></stop><stop offset="1" stop-color="#E6F0FF"></stop></radialGradient>
        <radialGradient id="dropPink" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FF6890"></stop><stop offset="1" stop-color="#FFC3D3"></stop></radialGradient>
        <filter id="softEdge" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
      </defs>
      <circle cx="175" cy="150" r="128" fill="#FFFFFF"></circle>
      <circle cx="175" cy="150" r="128" fill="none" stroke="#0D0D0D" stroke-width="1"></circle>
      <circle cx="175" cy="150" r="92" fill="#9CC7FF" opacity=".45" filter="url(#softEdge)"></circle>
      <circle cx="175" cy="150" r="78" fill="url(#leftOrb)"></circle>
      <circle cx="175" cy="150" r="86" fill="none" stroke="#0D0D0D" stroke-width="1" stroke-dasharray="3 4"></circle>
      <circle cx="238" cy="105" r="2" fill="#FF769C"></circle>
      <circle cx="244" cy="98" r="2.5" fill="#FF769C"></circle>
      <path d="M254 70 C260 80 264 86 264 92 a10 10 0 0 1 -20 0 C244 86 248 80 254 70 Z" fill="url(#dropPink)"></path>
      <g font-family="Archivo, Noto Sans KR, sans-serif" text-anchor="middle" fill="#0D0D0D">
        <text x="175" y="146" font-size="40" font-weight="300" letter-spacing="-2">37%</text>
        <text x="175" y="168" font-size="11">남은 예산</text>
        <text x="175" y="186" font-size="14" font-weight="300">444,600 ₩</text>
      </g>
      <g stroke="#0D0D0D" stroke-width=".8">
        <line x1="84" y1="60" x2="58" y2="34"></line>
        <line x1="114" y1="211" x2="70" y2="262"></line>
      </g>
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" fill="#0D0D0D">
        <text x="0" y="16" fill-opacity=".55">한 달 예산</text>
        <text x="0" y="30">1,200,000 ₩</text>
        <text x="0" y="278" fill-opacity=".55">점선 · 오늘 기준 적정 45%</text>
        <text x="0" y="292">적정보다 8%p 적게 남았어요</text>
        <text x="282" y="78" fill-opacity=".55">방금 결제</text>
        <text x="282" y="92">12,800 ₩</text>
      </g>
    </svg>

    <div class="row" style="gap:8px;margin-top:16px;align-items:stretch">
      <div class="chip" style="background:#FFE3EA"><p class="xs mu">월말 예상</p><p class="n" style="font-size:22px;margin-top:4px;color:#D93C66">−166,900 ₩</p><p class="xs mu" style="margin-top:2px">방금 전보다 −12,700</p></div>
      <div class="chip" style="background:#E6F0FF"><p class="xs mu">목표 진행률</p><p class="n" style="font-size:22px;margin-top:4px">38.2% 유지</p><p class="xs mu" style="margin-top:2px">선저축은 이미 끝났어요</p></div>
    </div>
  </section>

  <div style="position:absolute;left:16px;right:16px;bottom:30px">
    <div class="row" style="gap:8px">
      <button class="bt cw" style="flex:1;height:54px;font-size:15px;box-shadow:inset 0 0 0 1.5px #0D0D0D">확인</button>
      <a href="Spend.dc.html" class="bt cb" style="flex:1.7;height:54px;font-size:15px;color:#FFFFFF">카페 예산 다시 정하기</a>
    </div>
    <p class="xs mu" style="text-align:center;margin-top:10px">예산 초과 위험이 있을 때만 알려드려요</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
