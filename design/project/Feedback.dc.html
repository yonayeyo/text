<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실시간 피드백</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FAFAFA}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.dk{background:#FAFAFA;color:#0D0D0D}
.eng{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0;text-transform:none;font-weight:400}
.eng::before{content:"";width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;opacity:.45;flex:none}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.cur{font-size:.42em;letter-spacing:0;margin-left:.2em;font-weight:400;opacity:.45}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cw{background:#FFFFFF;color:#0D0D0D}
.cg{background:#EBEBE9;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.cv{background:#FF769C;color:#0D0D0D}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.card{border-radius:32px;padding:20px;corner-shape:squircle}
.lt{background:radial-gradient(70% 28% at 8% 6%,rgba(200,225,255,.95),rgba(200,225,255,0) 70%),radial-gradient(55% 22% at 100% 30%,rgba(255,118,156,.28),rgba(255,118,156,0) 70%),radial-gradient(70% 26% at 0% 62%,rgba(170,205,255,.6),rgba(170,205,255,0) 70%),radial-gradient(60% 24% at 95% 92%,rgba(255,170,195,.3),rgba(255,170,195,0) 70%),#EEEEEC;color:#0D0D0D}
.dim{opacity:.36}
.io{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(13,13,13,.2)}
.cb .io,.ob .io{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
</style>
</helmet>
<div class="ph lt" style="height:844px">

  <div class="row sb" style="padding:56px 20px 0">
    <button class="ib cw" style="width:44px;height:44px" aria-label="닫기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span class="tg cv">초과 위험</span>
  </div>

  <section role="dialog" aria-label="방금 결제한 지출 피드백" style="padding:26px 20px 0">
    <p class="sm mu">카페 · 체크카드 · 방금</p>
    <p class="n" style="font-size:52px;line-height:1;margin-top:10px">−12,800<span class="cur">₩</span></p>

    <div class="card cw" style="margin-top:24px">
      <div class="row sb"><p class="eng">Today</p><span class="xs mu">오늘 쓸 수 있는 돈 30,400 ₩</span></div>
      <svg width="310" height="150" viewBox="0 0 310 150" style="display:block;margin-top:16px" role="img" aria-label="오늘 쓸 수 있는 30,400원 중 17,600원 남음, 방금 12,800원 사용">
        <defs>
          <linearGradient id="todayLeft" x1="0" x2="1"><stop offset="0" stop-color="#EEF5FF"></stop><stop offset="1" stop-color="#9CC7FF"></stop></linearGradient>
          <linearGradient id="todaySpent" x1="0" x2="1"><stop offset="0" stop-color="#FF8DAE"></stop><stop offset="1" stop-color="#FFD3DF"></stop></linearGradient>
          <clipPath id="todayPill"><rect x="0" y="0" width="310" height="92" rx="46"></rect></clipPath>
        </defs>
        <g clip-path="url(#todayPill)">
          <rect x="0" y="0" width="180" height="92" fill="url(#todayLeft)"></rect>
          <rect x="180" y="0" width="130" height="92" fill="url(#todaySpent)"></rect>
        </g>
        <g font-family="Archivo, Noto Sans KR, sans-serif" fill="#0D0D0D">
          <text x="26" y="38" font-size="11" fill-opacity=".6">남은 돈</text>
          <text x="26" y="66" font-size="26" font-weight="300" letter-spacing="-1">17,600 ₩</text>
          <text x="198" y="38" font-size="11" fill-opacity=".6">방금 사용</text>
          <text x="198" y="66" font-size="18" font-weight="300">12,800</text>
        </g>
        <line x1="0" y1="114" x2="310" y2="114" stroke="#0D0D0D" stroke-opacity=".35"></line>
        <g fill="#0D0D0D"><circle cx="0.5" cy="114" r="3"></circle><circle cx="180" cy="114" r="3"></circle><circle cx="309.5" cy="114" r="3"></circle></g>
        <g font-family="Archivo, sans-serif" font-size="10" fill="#0D0D0D" fill-opacity=".55">
          <text x="0" y="136">0</text>
          <text x="180" y="136" text-anchor="middle">17,600</text>
          <text x="310" y="136" text-anchor="end">30,400 ₩</text>
        </g>
      </svg>
    </div>


    <div class="card cw" style="margin-top:8px;padding:18px 20px">
      <div class="row sb"><p class="eng">This month</p><span class="n" style="font-size:15px">444,600 ₩ 남음</span></div>
      <svg width="310" height="54" viewBox="0 0 310 54" style="display:block;margin-top:12px" role="img" aria-label="한 달 예산의 37% 남음, 오늘 기준 적정치 45%">
        <defs><linearGradient id="monthLeft" x1="0" x2="1"><stop offset="0" stop-color="#EEF5FF"></stop><stop offset="1" stop-color="#9CC7FF"></stop></linearGradient></defs>
        <rect x="0" y="6" width="310" height="14" rx="7" fill="#F1F1EF"></rect>
        <rect x="0" y="6" width="115" height="14" rx="7" fill="url(#monthLeft)"></rect>
        <line x1="139.5" y1="0" x2="139.5" y2="26" stroke="#0D0D0D" stroke-dasharray="2 2"></line>
        <circle cx="115" cy="13" r="4" fill="#0D0D0D"></circle>
        <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" fill="#0D0D0D">
          <text x="0" y="44" fill-opacity=".55">남은 37%</text>
          <text x="146" y="44" fill-opacity=".55">점선 · 오늘 기준 적정 45%</text>
        </g>
      </svg>
    </div>
    <div class="row" style="gap:8px;margin-top:8px;align-items:stretch">
      <div class="card" style="flex:1;background:#FFE3EA;padding:16px 18px"><p class="xs mu">월말 예상</p><p class="n" style="font-size:22px;margin-top:4px;color:#D93C66">−166,900 ₩</p><p class="xs mu" style="margin-top:2px">방금 전보다 −12,700</p></div>
      <div class="card" style="flex:1;background:#E6F0FF;padding:16px 18px"><p class="xs mu">목표 진행률</p><p class="n" style="font-size:22px;margin-top:4px">38.2% 유지</p><p class="xs mu" style="margin-top:2px">선저축은 이미 끝났어요</p></div>
    </div>
  </section>

  <div style="position:absolute;left:16px;right:16px;bottom:30px">
    <div class="row" style="gap:8px">
      <button class="bt cw" style="flex:1;height:54px;font-size:15px">확인</button>
      <a href="Spend.dc.html" class="bt cb" style="flex:1.7;height:54px;font-size:15px;color:#FFFFFF">카페 예산 다시 정하기</a>
    </div>
    <p class="xs mu" style="text-align:center;margin-top:10px">예산 초과 위험이 있을 때만 알려드려요</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
