<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>월간 리포트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#0D0D0D}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.dk{background:#0D0D0D;color:#fff}
.lt{background:#EBEBE9;color:#0D0D0D}
.eng{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.t1{font-size:34px;font-weight:300;line-height:1.16;letter-spacing:-.035em}
.t2{font-size:22px;font-weight:300;line-height:1.28;letter-spacing:-.03em}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.cur{font-size:.42em;letter-spacing:0;margin-left:.2em;font-weight:400}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cd{border-radius:32px;padding:22px;position:relative}
.cl{background:#D9F84A;color:#0D0D0D}
.cw{background:#FFFFFF;color:#0D0D0D}
.cg{background:#EBEBE9;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.cv{background:#A68BF5;color:#0D0D0D}
.cp{background:#EEF9B8;color:#0D0D0D}
.pl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;border:0;white-space:nowrap;text-decoration:none}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.gl{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);color:#fff}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.notch{-webkit-mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px);mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px)}
.nb{position:absolute;right:2px;bottom:2px;width:56px;height:56px}
.ai{display:flex;align-items:center;gap:8px;height:60px;border-radius:999px;padding:0 6px}
.ai input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:inherit;outline:none}
.ai input::placeholder{color:inherit;opacity:.55}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 0}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
</style>
</helmet>
<div class="ph lt" style="height:1960px">

  <div class="top">
    <a href="Main.dc.html" class="ib cw" style="width:44px;height:44px;color:#0D0D0D" aria-label="홈으로"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div class="row" style="gap:6px">
      <button class="pl cw" style="height:36px;font-size:12px">8월</button>
      <button class="pl cb" style="height:36px;font-size:12px" aria-pressed="true">9월</button>
    </div>
  </div>

  <section style="padding:26px 20px 0" aria-label="9월 요약">
    <p class="eng">Monthly report · 2026.09</p>
    <h1 class="t1" style="margin-top:10px">9월은<br>이렇게 보냈어요</h1>
  </section>

  <section style="position:relative;margin:22px 16px 0" aria-label="이번 달 잘한 점">
    <div class="cd cl notch" style="padding:22px 20px 24px">
      <p class="eng">Streak</p>
      <div class="row" style="gap:14px;margin-top:10px;align-items:flex-end">
        <p class="n" style="font-size:76px;line-height:.9">4</p>
        <p class="sm" style="padding-bottom:6px">개월 연속<br>선저축 성공</p>
      </div>
      <span class="tg cb" style="margin-top:14px">+120 P</span>
    </div>
    <button class="ib cb nb" aria-label="공유하기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
  </section>

  <section aria-label="목표 대비 실제" class="cd cw" style="margin:12px 16px 0;padding:22px 20px">
    <div class="row sb"><p class="eng">Plan vs actual</p>
      <div class="row xs" style="gap:10px"><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:4px;border:1.5px dashed #0D0D0D"></span>계획</span><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:4px;background:#0D0D0D"></span>실제</span></div>
    </div>
    <svg width="318" height="214" viewBox="0 0 318 214" style="display:block;margin-top:18px" role="img" aria-label="저축 계획 700,000원 실제 700,000원, 비상금 계획 100,000원 실제 60,000원, 변동 지출 계획 1,200,000원 실제 1,318,000원, 고정 지출 계획 585,000원 실제 585,000원">
      <line x1="0" y1="160" x2="318" y2="160" stroke="#0D0D0D" stroke-opacity=".2"></line>
      <rect x="10" y="85.7" width="28" height="74.3" rx="14" fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 3"></rect>
      <rect x="42" y="85.7" width="28" height="74.3" rx="14" fill="#D9F84A" stroke="#0D0D0D" stroke-width="1.5"></rect>
      <rect x="90" y="140" width="28" height="20" rx="10" fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 3"></rect>
      <rect x="122" y="146" width="28" height="14" rx="7" fill="#0D0D0D"></rect>
      <rect x="170" y="32.5" width="28" height="127.5" rx="14" fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 3"></rect>
      <rect x="202" y="20" width="28" height="140" rx="14" fill="#A68BF5"></rect>
      <rect x="250" y="97.9" width="28" height="62.1" rx="14" fill="none" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 3"></rect>
      <rect x="282" y="97.9" width="28" height="62.1" rx="14" fill="#0D0D0D"></rect>
      <g font-family="Archivo, Noto Sans KR, sans-serif" fill="#0D0D0D" text-anchor="middle">
        <text x="40" y="180" font-size="12">저축</text><text x="40" y="198" font-size="11" fill-opacity=".6">달성</text>
        <text x="120" y="180" font-size="12">비상금</text><text x="120" y="198" font-size="11" fill-opacity=".6">−40,000</text>
        <text x="200" y="180" font-size="12">변동 지출</text><text x="200" y="198" font-size="11" fill-opacity=".6">+118,000</text>
        <text x="280" y="180" font-size="12">고정</text><text x="280" y="198" font-size="11" fill-opacity=".6">동일</text>
        <text x="216" y="12" font-size="11">110%</text>
      </g>
    </svg>
    <p class="sm" style="margin-top:14px;line-height:1.55">저축은 계획대로 했지만, 쇼핑이 늘어 변동 지출이 118,000 ₩ 넘쳤어요. 그만큼 비상금 적립이 줄었어요.</p>
  </section>

  <section aria-label="다음 달 예산 조정 제안" class="cd cb" style="margin:12px 16px 0;padding:22px 20px">
    <div class="row sb"><p class="eng" style="color:#D9F84A">Next month</p><span class="xs mu">예산 조정 제안</span></div>
    <svg width="318" height="190" viewBox="0 0 318 190" style="display:block;margin-top:18px" role="img" aria-label="식비 380,000원에서 350,000원, 비상금 100,000원에서 150,000원, 카페 60,000원에서 40,000원으로 조정 제안">
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" fill="#FFFFFF" fill-opacity=".5">
        <text x="92" y="10" text-anchor="middle">9월</text><text x="226" y="10" text-anchor="middle">10월</text>
      </g>
      <line x1="92" y1="20" x2="92" y2="180" stroke="#FFFFFF" stroke-opacity=".15"></line>
      <line x1="226" y1="20" x2="226" y2="180" stroke="#FFFFFF" stroke-opacity=".15"></line>
      <line x1="92" y1="38" x2="226" y2="50" stroke="#FFFFFF" stroke-width="2"></line>
      <line x1="92" y1="150" x2="226" y2="130" stroke="#D9F84A" stroke-width="2"></line>
      <line x1="92" y1="166" x2="226" y2="174" stroke="#FFFFFF" stroke-width="2"></line>
      <circle cx="92" cy="38" r="5" fill="#FFFFFF"></circle><circle cx="226" cy="50" r="5" fill="#FFFFFF"></circle>
      <circle cx="92" cy="150" r="5" fill="#D9F84A"></circle><circle cx="226" cy="130" r="5" fill="#D9F84A"></circle>
      <circle cx="92" cy="166" r="5" fill="#FFFFFF"></circle><circle cx="226" cy="174" r="5" fill="#FFFFFF"></circle>
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" fill="#FFFFFF">
        <text x="0" y="42">식비</text><text x="80" y="42" text-anchor="end">380K</text>
        <text x="0" y="154" fill="#D9F84A">비상금</text><text x="80" y="154" text-anchor="end" fill="#D9F84A">100K</text>
        <text x="0" y="170">카페</text><text x="80" y="170" text-anchor="end">60K</text>
        <text x="238" y="54">350K</text>
        <text x="238" y="134" fill="#D9F84A">150K</text>
        <text x="238" y="178">40K</text>
      </g>
    </svg>
    <div class="row" style="gap:8px;margin-top:16px">
      <button class="bt gl" style="flex:1;height:50px;font-size:14px">수정</button>
      <button class="bt cl" style="flex:1.6;height:50px;font-size:14px">10월 예산에 반영</button>
    </div>
  </section>

  <section aria-label="다음 단계와 인접 영역" class="cd cw" style="margin:12px 16px 0;padding:22px 20px">
    <div class="row sb"><p class="eng">Next area</p><span class="tg cv">세금과 혜택 추천</span></div>
    <h2 class="t2" style="margin-top:10px">저축 습관이 잡혔으니<br>새는 세금을 막아볼까요</h2>
    <svg width="318" height="250" viewBox="0 0 318 250" style="display:block;margin-top:14px" role="img" aria-label="소비와 지출 완료, 저축과 투자 진행 중, 세금과 혜택 다음 추천, 대출과 신용과 보험과 은퇴는 확장 예정">
      <g fill="none" stroke="#0D0D0D" stroke-width="1.5">
        <path d="M159 46 L274 120"></path>
        <path d="M274 120 L230 214"></path>
        <path d="M230 214 L88 214" stroke-dasharray="2 5" stroke-opacity=".4"></path>
        <path d="M88 214 L44 120" stroke-dasharray="2 5" stroke-opacity=".4"></path>
        <path d="M44 120 L159 46" stroke-dasharray="2 5" stroke-opacity=".4"></path>
      </g>
      <circle cx="159" cy="46" r="40" fill="#0D0D0D"></circle>
      <circle cx="274" cy="120" r="40" fill="#D9F84A"></circle>
      <circle cx="230" cy="208" r="40" fill="#A68BF5"></circle>
      <circle cx="88" cy="208" r="36" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 4"></circle>
      <circle cx="44" cy="120" r="36" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5" stroke-dasharray="3 4"></circle>
      <g font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" text-anchor="middle">
        <text x="159" y="42" fill="#FFFFFF">소비와 지출</text><text x="159" y="58" fill="#D9F84A" font-size="10">완료</text>
        <text x="274" y="116" fill="#0D0D0D">저축과 투자</text><text x="274" y="132" fill="#0D0D0D" font-size="10">진행 중</text>
        <text x="230" y="204" fill="#0D0D0D">세금과 혜택</text><text x="230" y="220" fill="#0D0D0D" font-size="10">다음</text>
        <text x="88" y="204" fill="#0D0D0D">대출과 신용</text><text x="88" y="220" fill="#0D0D0D" fill-opacity=".5" font-size="10">확장 예정</text>
        <text x="44" y="116" fill="#0D0D0D">보험과 은퇴</text><text x="44" y="132" fill="#0D0D0D" fill-opacity=".5" font-size="10">확장 예정</text>
      </g>
    </svg>
    <a href="Benefits.dc.html" class="bt cb" style="margin-top:14px;height:54px;font-size:15px;color:#fff">연말정산 미리보기 시작</a>
  </section>

  <section style="position:relative;margin:12px 16px 0" aria-label="재진단 안내">
    <div class="cd cp notch" style="padding:22px 20px 24px">
      <div class="row sb"><p class="eng">Re-check</p><span class="xs">진단 후 32일</span></div>
      <h2 class="t2" style="margin-top:10px">한 달 사이<br>얼마나 달라졌을까요</h2>
      <div class="row" style="gap:10px;margin-top:14px;font-size:12px">
        <span class="tg cw">지난 실천 점수 2.9</span>
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        <span class="tg" style="border:1.5px dashed #0D0D0D">?</span>
      </div>
    </div>
    <a href="Onboard-Self.dc.html" class="ib cb nb" aria-label="다시 진단하기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path></svg></a>
  </section>

  <section aria-label="AI 조언" style="margin:22px 16px 0">
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <button class="pl cw" style="height:34px;font-size:12px"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>쇼핑을 어떻게 줄일까?</button>
      <button class="pl cw" style="height:34px;font-size:12px">목표를 앞당기려면?</button>
    </div>
    <div class="ai cb" style="margin-top:10px">
      <button class="ib gl" aria-label="음성으로 질문하기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <input type="text" aria-label="리포트에 대해 질문하기" placeholder="9월 결과로 물어보기">
      <button class="ib cl" aria-label="보내기"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
    </div>
  </section>
</div>
</x-dc>
