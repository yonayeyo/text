<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>저축 인출 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FAFAFA}
.ph{position:relative;width:390px;overflow:hidden;font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:112%;color:#0D0D0D;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.01em;line-height:1.4}
.ph *{box-sizing:border-box}
:where(.ph) :where(h1,h2,h3,p){margin:0;font-weight:inherit;font-size:inherit}
:where(.ph) button{font-family:inherit;font-stretch:inherit;cursor:pointer;color:inherit}
.dk{background:#FAFAFA;color:#0D0D0D}
.eng{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.t1{font-size:34px;font-weight:300;line-height:1.16;letter-spacing:-.035em}
.n{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.045em;white-space:nowrap}
.sm{font-size:13px}.xs{font-size:11px}
.mu{opacity:.56}
.cd{border-radius:32px;padding:22px;position:relative}
.cd{border-radius:40px}
.cd,.step,.st,.tm,.opt,.fld,.term,.bf,.alloc div,.lt,[style*="border-radius:2"],[style*="border-radius:3"],[style*="border-radius:4"]{corner-shape:squircle}
.gb{background:radial-gradient(120% 115% at 28% 40%,#A9CFFF 0%,#C8E1FF 40%,#E2EEFF 76%,#F5F9FF 100%);box-shadow:inset 0 0 20px 6px rgba(255,255,255,.92),inset 0 0 64px 8px rgba(255,255,255,.4);color:#0D0D0D}
.gp{background:radial-gradient(120% 115% at 28% 40%,#FF6890 0%,#FF86A8 40%,#FFBACD 80%,#FFDDE6 100%);box-shadow:inset 0 0 20px 6px rgba(255,255,255,.85),inset 0 0 64px 8px rgba(255,255,255,.3);color:#0D0D0D}
.gm{background:radial-gradient(90% 120% at 18% 30%,#FF7FA3 0%,rgba(255,127,163,0) 62%),radial-gradient(90% 120% at 90% 85%,#B9D8FF 0%,rgba(185,216,255,0) 70%),#E9C6E6;box-shadow:inset 0 0 20px 6px rgba(255,255,255,.88),inset 0 0 64px 8px rgba(255,255,255,.35);color:#0D0D0D}
.cl{background:#C8E1FF;color:#0D0D0D}
.cv{background:#FF769C;color:#0D0D0D}
.cb{background:#0D0D0D;color:#FFFFFF}
.ib{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;flex:none;text-decoration:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:999px;border:0;font-size:16px;font-weight:500;width:100%;text-decoration:none}
.gl{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(13,13,13,.08);color:#0D0D0D}
.cb .gl{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
.cg{background:#EBEBE9;color:#0D0D0D}
.cw{background:#FFFFFF;color:#0D0D0D}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.notch{-webkit-mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px);mask:radial-gradient(circle 35px at calc(100% - 30px) calc(100% - 30px),transparent 34px,#000 34.6px)}
.nb{position:absolute;right:2px;bottom:2px;width:56px;height:56px}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;padding:56px 20px 0}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
</style>
</helmet>
<div class="ph dk" style="height:844px">

  <div class="top">
    <a href="Goal.dc.html" class="ib cg" style="width:44px;height:44px" aria-label="취소"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span class="tg cg">저축 계좌 → 생활비</span>
  </div>

  <section style="padding:26px 20px 0" aria-label="인출 확인">
    <p class="eng">Before you withdraw</p>
    <h1 class="t1" style="margin-top: 10px; font-size: 34px">저축에서<br>500,000원 꺼낼까요?</h1>
  </section>

  <section class="cd cg" style="margin:18px 16px 0;padding:20px 20px" aria-label="목표에 미치는 영향">
    <div class="row sb"><p class="eng">Impact</p><span class="tg cv">완료 1개월 늦어짐</span></div>
    <svg width="318" height="170" viewBox="0 0 318 170" style="display:block;margin-top:14px" role="img" aria-label="그대로 두면 3단계 2027년 1월, 완료 2028년 11월. 지금 꺼내면 3단계 2027년 2월, 완료 2028년 12월">
      <defs>
        <linearGradient id="impB" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#9CC7FF"></stop></linearGradient>
        <linearGradient id="impP" x1="0" x2="1"><stop offset="0" stop-color="#FFC3D3"></stop><stop offset="1" stop-color="#FF769C"></stop></linearGradient>
      </defs>
      <rect x="16" y="28" width="275.0" height="16" rx="8" fill="url(#impB)"></rect><circle cx="49.0" cy="36" r="3.5" fill="#0D0D0D"></circle><circle cx="291.0" cy="36" r="6" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5"></circle><text x="0" y="18" font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" fill="#0D0D0D" fill-opacity=".55">그대로 두면</text><text x="49.0" y="60" font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" text-anchor="middle" fill="#0D0D0D" fill-opacity=".6">3단계 27.01</text><text x="291.0" y="60" font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" text-anchor="end" fill="#0D0D0D">28.11 완료</text>
      <rect x="16" y="92" width="275.0" height="16" rx="8" fill="url(#impB)"></rect><rect x="283.0" y="92" width="19.0" height="16" rx="8" fill="url(#impP)"></rect><circle cx="60.0" cy="100" r="3.5" fill="#0D0D0D"></circle><circle cx="302.0" cy="100" r="6" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="1.5"></circle><text x="0" y="82" font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" fill="#0D0D0D" fill-opacity=".55">지금 꺼내면</text><text x="60.0" y="124" font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" text-anchor="middle" fill="#0D0D0D" fill-opacity=".6">3단계 27.02</text><text x="302.0" y="124" font-family="Archivo, Noto Sans KR, sans-serif" font-size="11" text-anchor="end" fill="#D93C66">28.12 완료</text>
      <line x1="16" y1="146" x2="302" y2="146" stroke="#0D0D0D" stroke-opacity=".25"></line>
      <circle cx="16" cy="146" r="2" fill="#0D0D0D"></circle><text x="16" y="164" font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" text-anchor="middle" fill="#0D0D0D" fill-opacity=".5">지금</text>
      <circle cx="49.0" cy="146" r="2" fill="#0D0D0D"></circle><text x="49.0" y="164" font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" text-anchor="middle" fill="#0D0D0D" fill-opacity=".5">2027</text><circle cx="181.0" cy="146" r="2" fill="#0D0D0D"></circle><text x="181.0" y="164" font-family="Archivo, Noto Sans KR, sans-serif" font-size="10" text-anchor="middle" fill="#0D0D0D" fill-opacity=".5">2028</text>
    </svg>
    <div class="row" style="margin-top:12px;border-top:1px solid rgba(13,13,13,.1);padding-top:14px">
      <div style="flex:1"><p class="xs mu">진행률</p><p class="n" style="font-size:18px;margin-top:2px">38.2 → 36.5%</p></div>
      <div style="width:1px;align-self:stretch;background:rgba(13,13,13,.1);margin:0 16px"></div>
      <div style="flex:1"><p class="xs mu">다시 채우려면</p><p class="n" style="font-size:18px;margin-top:2px">약 1개월</p></div>
    </div>
  </section>

  <section style="position:relative;margin:12px 16px 0" aria-label="다른 방법 제안">
    <div class="cd cl notch" style="padding:20px 20px 22px">
      <p class="eng">Option</p>
      <p style="font-size:18px;font-weight:300;line-height:1.35;margin-top:8px">비상금 1,200,000 ₩에서 꺼내면<br>목표 일정은 그대로예요</p>
    </div>
    <button class="ib cb nb" aria-label="비상금에서 꺼내기"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </section>

  <div style="position:absolute;left:16px;right:16px;bottom:34px">
    <button class="bt cg">그래도 저축에서 꺼내기</button>
    <p class="xs mu" style="text-align:center;margin-top:12px">인출은 언제든 할 수 있어요. 영향만 먼저 보여드려요.</p>
  </div>
</div>
</x-dc>
